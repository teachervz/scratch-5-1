/* =====================================================================
   🧩 أنواع الشرائح
   ===================================================================== */
const RENDER = {};

/* شريحة مفهوم: الاسم + سؤال توقّع + المعنى البسيط + مثال من الحياة */
RENDER.idea = (s, root) => {
  const ex = s.example;
  const exHTML = ex ? `<div class="id-ex"><span class="id-ex-ic">${ex.icon}</span><div class="id-ex-c"><b>مثال:</b> ${ex.text}
      ${ex.steps ? `<div class="id-steps">${ex.steps.map((t, i) => `${i ? '<span class="id-ar">⟵</span>' : ''}<span class="id-st"><i>${i + 1}</i>${t}</span>`).join('')}</div>` : ''}
    </div></div>${ex.flow ? flowHTML(ex.flow) : ''}` : '';
  root.innerHTML = `<div class="sl-inner idea-sl">
    <div class="id-main">
      <span class="chip st"><b dir="ltr">//</b> ${s.chip || 'مفهوم جديد 💡'}</span>
      <h1 class="id-term st">${s.term}</h1>
      <div class="id-box st">
        <p class="id-ask">${s.ask}</p>
        <button class="btn big reveal">💡 اكشفي المعنى</button>
        <div class="id-hidden">
          <p class="id-simple">${s.simple}</p>
          ${exHTML}
          ${s.chips ? `<div class="id-chips">${s.chips.map(c => `<span>${c}</span>`).join('')}</div>` : ''}
          ${s.book ? `<p class="id-book">📘 ${s.book}</p>` : ''}
        </div>
      </div>
    </div>
    <div class="id-vis st"><div class="id-circle"><span>${s.icon}</span></div><span class="idq a">؟</span><span class="idq b">؟</span><span class="idq c">؟</span></div>
  </div>`;
  const bx = root.querySelector('.id-box');
  root.querySelector('.reveal').onclick = () => { bx.classList.add('open'); Sound.ding(); };
};

/* مقارنة بين مفهومين */
RENDER.compare = (s, root) => {
  root.innerHTML = shell(s, `<div class="cmp">${s.sides.map((sd, i) => `<div class="cmp-card k${i} st"><div class="cmp-ic">${sd.icon}</div><h3>${sd.name}</h3><p class="cmp-def">${sd.def}</p><div class="cmp-ex">${sd.examples.map(e => `<span>${e}</span>`).join('')}</div></div>`).join('<div class="cmp-vs st">أم</div>')}</div>
    ${s.tip ? `<p class="cmp-tip st">${s.tip}</p>` : ''}`);
};

/* 🚇 رحلة المراجعة في مترو الرياض: كل مقطورة سؤال، والإجابات مقاعد */
RENDER.metro = (s, root) => {
  const Q = s.questions;
  const lum = h => { const n = parseInt(h.slice(1), 16); return ((n >> 16) * 299 + (n >> 8 & 255) * 587 + (n & 255) * 114) / 1000; };
  const tc = h => lum(h) > 170 ? '#3B2500' : '#fff';
  const lt = h => lum(h) > 170 ? '#9A6B00' : h;
  const vars = q => `--lc:${q.color};--tc:${tc(q.color)};--lt:${lt(q.color)}`;
  root.innerHTML = `<div class="metro">
    <div class="mt-sky" style="background-image:url('${IMG.skyline}')"></div>
    <header class="mt-head st"><span class="chip"><b dir="ltr">//</b> ${s.chip}</span><h2>🚇 ${s.title}</h2></header>
    <div class="mt-map st"><div class="mt-line"></div>${Q.map((q, i) => `<div class="mt-st" style="${vars(q)}"><span class="mt-dot">${i + 1}</span><small>${q.station}</small></div>`).join('')}</div>
    <div class="mt-plat"></div>
    <div class="mt-train-wrap"><div class="mt-train">${Q.map((q, i) => `<button class="mt-car${i === 0 ? ' head' : ''}${i === Q.length - 1 ? ' tail' : ''}" style="${vars(q)}">
        <span class="mt-num">${i + 1}</span><span class="mt-win w1"></span><span class="mt-door"><i class="dl"></i><i class="dr"></i></span><span class="mt-win w2"></span>
        <span class="mt-band"></span><span class="mt-lbl">المقطورة ${i + 1}</span><span class="mt-ok">✔</span><span class="mt-light"></span>
        <span class="mt-bogie b1"></span><span class="mt-bogie b2"></span></button>`).join('')}</div><div class="mt-rail"></div></div>
    <p class="mt-hint">👆 اختاري مقطورة واصعدي إليها لتجيبي عن سؤالها</p>
    <div class="mt-done"><div class="big">🎉</div><h3>وصلنا بالسلامة!</h3><p class="dn-p"></p><button class="btn again">🔁 رحلة جديدة</button></div>
    <div class="mt-ticket">
      <div class="tk">
        <div class="tk-main">
          <div class="tk-top"><span class="tk-logo">🚇</span><b>مترو الرياض</b><em>RIYADH METRO</em></div>
          <div class="tk-row"><span>الراكبة</span><b>${s.passenger || 'طالبات الصف الخامس 👧'}</b></div>
          <div class="tk-row"><span>الرحلة</span><b>${s.trip || s.chip}</b></div>
          <div class="tk-row"><span>المحطات</span><b>${Q.length} محطات • ${Q.length} أسئلة</b></div>
        </div>
        <div class="tk-stub"><div class="tk-bar"></div><span>تذكرة ذهاب</span></div>
        <div class="tk-stamp">✔ مفعّلة</div>
      </div>
      <button class="btn big tk-go">🎫 فعّلي التذكرة وابدئي الرحلة</button>
    </div>
    <div class="mt-inside">
      <div class="in-bg"></div><div class="in-shade"></div>
      <button class="btn ghost sm in-x">✖ رجوع</button>
      <div class="in-led"><span class="led-dot"></span><span class="led-txt"></span></div>
      <div class="in-q"></div>
      <div class="in-seats"></div>
      <div class="in-res"><div class="fb"></div><span class="in-why"></span><button class="btn teal in-back">🚉 العودة إلى المحطة</button></div>
    </div>
  </div>`;
  const M = root.querySelector('.metro'), train = root.querySelector('.mt-train');
  const cars = [...root.querySelectorAll('.mt-car')], sts = [...root.querySelectorAll('.mt-st')];
  const ticket = root.querySelector('.mt-ticket'), stamp = root.querySelector('.tk-stamp');
  const inside = root.querySelector('.mt-inside'), seats = root.querySelector('.in-seats'), res = root.querySelector('.in-res');
  const fb = res.querySelector('.fb'), why = root.querySelector('.in-why'), doneCard = root.querySelector('.mt-done');
  let done = Q.map(() => false), first = Q.map(() => true), cur = -1, started = false, solved = false, timers = [];
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));

  const arrive = () => { M.classList.add('arrived'); Sound.whoosh(2.6); later(() => Sound.chime(), 2300); };
  root.querySelector('.tk-go').onclick = () => {
    stamp.classList.add('on'); Sound.ding();
    later(() => { ticket.classList.add('hide'); started = true; arrive(); }, 1100);
  };

  const open = i => {
    if (!started || cur >= 0 || done[i] || !M.classList.contains('arrived') || M.classList.contains('departed')) { if (done[i]) pop(cars[i]); return; }
    cur = i; solved = false; const q = Q[i], car = cars[i];
    car.classList.add('open'); Sound.hiss();
    later(() => {
      const p = stagePoint(car);
      inside.style.transformOrigin = `${p.x}px ${p.y}px`;
      inside.setAttribute('style', `${vars(q)};transform-origin:${p.x}px ${p.y}px`);
      inside.querySelector('.in-bg').style.backgroundImage = `url('${i % 2 ? IMG.seats : IMG.metro}')`;
      inside.querySelector('.led-txt').textContent = `المحطة: ${q.station}   •   المقطورة ${i + 1}`;
      inside.querySelector('.in-q').innerHTML = `<span class="qn">السؤال ${i + 1} من ${Q.length}</span>${q.q}`;
      seats.innerHTML = q.options.map(o => `<button class="seat"><span class="seat-back">${o}</span><span class="seat-cush"></span><span class="seat-leg"></span></button>`).join('');
      res.className = 'in-res'; why.textContent = '';
      [...seats.children].forEach((b, k) => b.onclick = () => {
        if (solved) return;
        if (k === q.answer){
          solved = true; done[i] = true; b.classList.add('ok');
          [...seats.children].forEach(o => o !== b && o.classList.add('dim'));
          feedback(fb, true); why.textContent = q.why || ''; res.className = 'in-res show solved';
          Sound.success(); confettiAt(b);
        } else {
          first[i] = false; b.classList.add('no'); shake(b);
          feedback(fb, false); why.textContent = ''; res.className = 'in-res show';
          Sound.error();
        }
      });
      inside.classList.add('show'); Sound.chime();
    }, 520);
  };

  const close = (instant) => {
    if (cur < 0) return;
    const i = cur; cur = -1;
    inside.classList.remove('show'); cars[i].classList.remove('open');
    if (done[i]){ cars[i].classList.add('done'); sts[i].classList.add('done'); sts[i].querySelector('.mt-dot').textContent = '✔'; }
    if (instant) return;
    Sound.hiss();
    if (done.every(Boolean)) depart();
  };

  const depart = () => {
    later(() => Sound.chime(), 700);
    later(() => { M.classList.add('departed'); Sound.whoosh(3); }, 1700);
    later(() => {
      const score = first.filter(Boolean).length;
      doneCard.querySelector('.dn-p').innerHTML = `أجبتِ عن أسئلة المحطات كلها 👏<br>⭐ ${score} من ${Q.length} من أول محاولة`;
      doneCard.classList.add('show'); Sound.success(); burst(960, 560, 80);
    }, 4300);
  };

  const reset = () => {
    timers.forEach(clearTimeout); timers = [];
    done = Q.map(() => false); first = Q.map(() => true); cur = -1;
    doneCard.classList.remove('show'); inside.classList.remove('show');
    cars.forEach(c => c.classList.remove('done', 'open'));
    sts.forEach((st, i) => { st.classList.remove('done'); st.querySelector('.mt-dot').textContent = i + 1; });
    train.style.transition = 'none'; M.classList.remove('arrived', 'departed'); void train.offsetWidth; train.style.transition = '';
    later(arrive, 200);
  };

  cars.forEach((c, i) => c.onclick = () => open(i));
  root.querySelector('.in-x').onclick = () => close();
  root.querySelector('.in-back').onclick = () => close();
  root.querySelector('.again').onclick = reset;
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && root.classList.contains('active')) close(); });
  root._leave = () => close(true);
};

    </div>
  </div>`;
  const body = root.querySelector('.cw-body');

  root._enter = () => {
    clearTimeout(tm); body.innerHTML = '';
    let li = 0, ti = 0, ci = 0, lineEl = null, tokEl = null, chars = [];
    const caret = document.createElement('span'); caret.className = 'caret';
    const step = () => {
      if (li >= s.code.length){ body.lastChild && body.lastChild.appendChild(caret); return; }
      const line = s.code[li];
      if (!lineEl){ lineEl = document.createElement('div'); lineEl.className = 'cl'; lineEl.innerHTML = `<span class="ln">${li + 1}</span>`; body.appendChild(lineEl); ti = 0; tokEl = null; }
      if (ti >= line.length){ li++; lineEl = null; tm = setTimeout(step, 200); return; }
      if (!tokEl){ tokEl = document.createElement('span'); tokEl.className = 'tk-' + line[ti][0]; lineEl.appendChild(tokEl); chars = Array.from(line[ti][1]); ci = 0; }
      tokEl.textContent += chars[ci++]; lineEl.appendChild(caret);
      if (ci >= chars.length){ ti++; tokEl = null; }
      tm = setTimeout(step, 36);
    };
    tm = setTimeout(step, 800);
  };
  root._leave = () => clearTimeout(tm);
};

RENDER.sort = (s, root) => {
  const bk = (b, i) => `<div class="bucket b${i} st" data-b="${i}"><div class="bk-h"><span class="bk-ic">${b.icon}</span><div><h3>${b.title}</h3><p>${b.desc}</p></div></div><div class="bk-items"></div></div>`;
  root.innerHTML = shell(s, `<div class="sort">
      ${bk(s.buckets[0], 0)}
      <div class="sort-pool st"><p class="hint-line">${s.instruction}</p><div class="pool-items"></div><div class="fb"></div><button class="btn ghost sm rs">↺ إعادة</button></div>
      ${bk(s.buckets[1], 1)}
    </div>`);
  const pool = root.querySelector('.pool-items'), fb = root.querySelector('.fb');
  let sel = null;
  const build = () => {
    sel = null; pool.innerHTML = ''; root.querySelectorAll('.bk-items').forEach(b => b.innerHTML = ''); clearFb(fb);
    shuffle(s.items).forEach(it => {
      const b = document.createElement('button'); b.className = 'sitem'; b.draggable = true; b.dataset.t = it.type;
      b.innerHTML = `<span>${it.icon}</span>${it.text}`;
      b.onclick = e => {
        e.stopPropagation();
        if (b.classList.contains('placed')) return;
        if (sel) sel.classList.remove('sel');
        sel = (sel === b) ? null : b;
        if (sel) sel.classList.add('sel');
        Sound.click();
      };
      b.ondragstart = e => { if (b.classList.contains('placed')) return e.preventDefault(); if (sel) sel.classList.remove('sel'); sel = b; b.classList.add('sel'); e.dataTransfer.setData('text', 'x'); };
      pool.appendChild(b);
    });
  };
  const place = bucket => {
    if (!sel){ feedback(fb, false, 'اختاري بطاقة أولاً 👆'); return; }
    const b = sel;
    if (b.dataset.t === bucket.dataset.b){
      b.classList.remove('sel'); b.classList.add('placed'); bucket.querySelector('.bk-items').appendChild(b); pop(b); sel = null;
      if (!pool.children.length){ feedback(fb, true, s.done || 'رائع! 🎉'); Sound.success(); burst(960, 520, 70); }
      else { feedback(fb, true, 'أحسنتِ! ✔'); Sound.ding(); }
    } else { shake(b); Sound.error(); feedback(fb, false, s.wrongHint || LESSON.messages.wrong); }
  };
  root.querySelectorAll('.bucket').forEach(bu => {
    bu.onclick = () => place(bu);
    bu.ondragover = e => { e.preventDefault(); bu.classList.add('over'); };
    bu.ondragleave = () => bu.classList.remove('over');
    bu.ondrop = e => { e.preventDefault(); bu.classList.remove('over'); place(bu); };
  });
  root.querySelector('.rs').onclick = build;
  build();
};

/* لعبة: برمجة القطة للوصول إلى السمكة */
RENDER.robot = (s, root) => {
  root.innerHTML = shell(s, `<div class="robot">
    <div class="rb-board st"><div class="grid"></div></div>
    <div class="rb-panel st">
      <p class="rb-task">${s.task}</p>
      <div class="rb-levels">${s.levels.map((_, i) => `<button class="lv">المستوى ${i + 1}</button>`).join('')}</div>
      <div class="rb-cmds">
        <button data-d="R">➡️<span>يمين</span></button><button data-d="U">⬆️<span>أعلى</span></button>
        <button data-d="D">⬇️<span>أسفل</span></button><button data-d="L">⬅️<span>يسار</span></button>
      </div>
      <div class="rb-prog"></div>
      <div class="rb-acts"><button class="btn teal run">▶ تشغيل</button><button class="btn ghost sm undo">⌫ تراجع</button><button class="btn ghost sm clr">🗑 مسح</button></div>
      <div class="fb"></div>
      ${s.lesson ? `<div class="lesson">${s.lesson}</div>` : ''}
    </div>
  </div>`);
  const grid = root.querySelector('.grid'), prog = root.querySelector('.rb-prog'), panel = root.querySelector('.rb-panel');
  const fb = root.querySelector('.fb'), lesson = root.querySelector('.lesson');
  const CELL = 100, GAP = 8;
  const DIRS = { U: [0, -1, '⬆️', 'لأعلى'], D: [0, 1, '⬇️', 'لأسفل'], R: [1, 0, '➡️', 'لليمين'], L: [-1, 0, '⬅️', 'لليسار'] };
  let L, pos, list = [], running = false, sprite;
  const isWall = (c, r) => L.walls.some(w => w[0] === c && w[1] === r);
  const tr = p => `translate(${p[0] * (CELL + GAP)}px, ${p[1] * (CELL + GAP)}px)`;
  const place = instant => { sprite.style.transition = instant ? 'none' : ''; sprite.style.transform = tr(pos); };
  const drawProg = () => {
    prog.innerHTML = list.length
      ? list.map((d, i) => `<span class="pb"><b>${i + 1}</b>${DIRS[d][2]} ${DIRS[d][3]}</span>`).join('')
      : '<span class="ph">اضغطي على الأسهم لإضافة التعليمات… 🧩</span>';
  };
  const resetRun = () => { pos = L.start.slice(); place(true); clearFb(fb); lesson && lesson.classList.remove('show'); };
  const load = i => {
    L = s.levels[i]; list = [];
    root.querySelectorAll('.lv').forEach((b, k) => b.classList.toggle('on', k === i));
    grid.style.gridTemplateColumns = `repeat(${L.cols}, ${CELL}px)`; grid.innerHTML = '';
    for (let r = 0; r < L.rows; r++) for (let c = 0; c < L.cols; c++){
      const d = document.createElement('div'); d.className = 'cell';
      if (isWall(c, r)){ d.classList.add('wall'); d.textContent = '🧱'; }
      if (c === L.goal[0] && r === L.goal[1]){ d.classList.add('goal'); d.textContent = '🐟'; }
      if (c === L.start[0] && r === L.start[1]) d.classList.add('start');
      grid.appendChild(d);
    }
    sprite = document.createElement('div'); sprite.className = 'sprite'; sprite.textContent = '🐱'; grid.appendChild(sprite);
    resetRun(); drawProg();
  };
  root.querySelectorAll('.lv').forEach((b, i) => b.onclick = () => { if (!running) load(i); });
  root.querySelectorAll('.rb-cmds button').forEach(b => b.onclick = () => {
    if (running) return;
    if (list.length >= 20){ feedback(fb, false, 'يكفي 20 تعليمة 😊'); return; }
    list.push(b.dataset.d); drawProg(); resetRun(); Sound.click();
  });
  root.querySelector('.undo').onclick = () => { list.pop(); drawProg(); resetRun(); };
  root.querySelector('.clr').onclick = () => { list = []; drawProg(); resetRun(); };
  root.querySelector('.run').onclick = async () => {
    if (running) return;
    if (!list.length){ feedback(fb, false, 'أضيفي تعليمات أولاً 🧩'); return; }
    running = true; panel.classList.add('busy'); resetRun();
    await wait(250);
    const blocks = [...prog.querySelectorAll('.pb')];
    for (let i = 0; i < list.length; i++){
      blocks.forEach((b, k) => b.classList.toggle('run', k === i));
      const [dc, dr] = DIRS[list[i]], nc = pos[0] + dc, nr = pos[1] + dr;
      if (nc < 0 || nr < 0 || nc >= L.cols || nr >= L.rows || isWall(nc, nr)){
        sprite.animate([{ transform: tr(pos) }, { transform: tr(pos) + ` translate(${dc * 30}px,${dr * 30}px)` }, { transform: tr(pos) }], { duration: 380 });
        Sound.error(); feedback(fb, false, '💥 اصطدمت القطة! راجعي التعليمات وحاولي مرة أخرى 💜');
        running = false; panel.classList.remove('busy'); return;
      }
      pos = [nc, nr]; place(); Sound.step(); await wait(480);
    }
    blocks.forEach(b => b.classList.remove('run'));
    if (pos[0] === L.goal[0] && pos[1] === L.goal[1]){
      feedback(fb, true, '🎉 وصلت القطة إلى السمكة! برنامجكِ صحيح'); Sound.success(); confettiAt(sprite); lesson && lesson.classList.add('show');
    } else feedback(fb, false, '🤔 لم تصل القطة إلى السمكة بعد… أكملي التعليمات');
    running = false; panel.classList.remove('busy');
  };
  load(0);
};

      </div>

    </div>
  </div>`);
  const cv = root.querySelector('canvas'), ctx = cv.getContext('2d'), fb = root.querySelector('.fb'), pred = root.querySelector('.cm-predict');
  const blocks = [...root.querySelectorAll('.blk')], algo = [...root.querySelectorAll('.cm-algo span')];
  const W = 960, H = 720, X = x => (x + 240) * 2, Y = y => (180 - y) * 2;

  // خلفية المدينة ليلاً (تُرسم مرة واحدة)
  const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
  (g => {
    const sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#0B1736'); sky.addColorStop(1, '#2A4380');
    g.fillStyle = sky; g.fillRect(0, 0, W, H);
    let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    g.fillStyle = 'rgba(255,255,255,.85)';
    for (let i = 0; i < 70; i++){ g.beginPath(); g.arc(rnd() * W, rnd() * H * .5, rnd() * 2 + .6, 0, 7); g.fill(); }
    let x = 0;
    while (x < W){
      const w = 60 + rnd() * 70, h = 80 + rnd() * 120, top = H - 110 - h;
      g.fillStyle = rnd() > .5 ? '#101B38' : '#18264E'; g.fillRect(x, top, w - 6, h);
      for (let wy = top + 14; wy < H - 126; wy += 24) for (let wx = x + 10; wx < x + w - 20; wx += 19)
        if (rnd() > .45){ g.fillStyle = '#FCD34D'; g.fillRect(wx, wy, 9, 12); }
      x += w;
    }
    g.fillStyle = '#5B6170'; g.fillRect(0, H - 110, W, 110);
    g.fillStyle = '#3B3F4A'; g.fillRect(0, H - 110, W, 8);
    g.fillStyle = '#FACC15'; for (let i = 10; i < W; i += 80) g.fillRect(i, H - 58, 44, 6);
  })(bg.getContext('2d'));

  const pen = document.createElement('canvas'); pen.width = W; pen.height = H; const pc = pen.getContext('2d');
  let cat, runId = 0;
  const render = () => {
    ctx.drawImage(bg, 0, 0); ctx.drawImage(pen, 0, 0);
    ctx.font = '96px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🐱', X(cat.x), Y(cat.y));
    if (cat.say){
      ctx.font = '700 34px Tajawal, Tahoma, sans-serif'; ctx.direction = 'rtl';
      const tw = ctx.measureText(cat.say).width + 50, bx = Math.min(W - tw - 10, X(cat.x) - 30), by = Y(cat.y) - 160;
      ctx.fillStyle = '#fff'; ctx.strokeStyle = '#C9C3E8'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(bx, by, tw, 70, 26) : ctx.rect(bx, by, tw, 70); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(X(cat.x) - 10, by + 68); ctx.lineTo(X(cat.x) + 8, by + 100); ctx.lineTo(X(cat.x) + 24, by + 68); ctx.fill();
      ctx.fillStyle = '#1F1A4D'; ctx.textAlign = 'center'; ctx.fillText(cat.say, bx + tw / 2, by + 37);
      ctx.direction = 'ltr';
    }
  };
  const reset = () => { runId++; cat = { x: 60, y: -110, dir: 90, say: '', pen: false, color: '#FFF4C2', size: 1 }; pc.clearRect(0, 0, W, H); hl(-1, -1); render(); };
  const hl = (b, a, keep) => {
    blocks.forEach(el => el.classList.toggle('run', +el.dataset.b === b || (!!keep && +el.dataset.b === 9)));
    algo.forEach((el, i) => el.classList.toggle('run', i === a));
  };
  const stroke = (x1, y1, x2, y2) => {
    pc.strokeStyle = cat.color; pc.lineWidth = cat.size * 2; pc.lineCap = 'round';
    pc.shadowColor = 'rgba(255,244,194,.55)'; pc.shadowBlur = 24;
    pc.beginPath(); pc.moveTo(X(x1), Y(y1)); pc.lineTo(X(x2), Y(y2)); pc.stroke();
  };
  const move = (n, dur, id) => new Promise(res => {
    const sx = cat.x, sy = cat.y, rad = cat.dir * Math.PI / 180, tx = sx + Math.sin(rad) * n, ty = sy + Math.cos(rad) * n, t0 = performance.now();
    const f = now => {
      if (id !== runId) return res();
      const k = Math.min(1, (now - t0) / dur), px = cat.x, py = cat.y;
      cat.x = sx + (tx - sx) * k; cat.y = sy + (ty - sy) * k;
      if (cat.pen) stroke(px, py, cat.x, cat.y);
      render(); k < 1 ? requestAnimationFrame(f) : res();
    };
    requestAnimationFrame(f);
  });
  const run = async () => {
    reset(); const id = runId, ok = () => id === runId;
    pred.classList.add('hide'); clearFb(fb);
    hl(0, -1); await wait(500); if (!ok()) return;
    hl(1, -1); pc.clearRect(0, 0, W, H); render(); await wait(400); if (!ok()) return;
    hl(2, 0); cat.say = s.say; render(); await wait(2000); if (!ok()) return; cat.say = ''; render();
    hl(3, 1); await move(100, 700, id); if (!ok()) return;
    hl(4, 1); await wait(350); cat.dir -= 90; if (!ok()) return;
    hl(5, 1); await move(130, 800, id); if (!ok()) return;
    hl(6, 2); cat.color = '#FFF4C2'; await wait(450); if (!ok()) return;
    hl(7, 2); cat.pen = true; await wait(450); if (!ok()) return;
    hl(8, 2); cat.size = 40; await wait(450); if (!ok()) return;
    for (let i = 0; i < 45; i++){
      hl(10, 3, true); await move(3, 26, id); if (!ok()) return;
      hl(11, 3, true); cat.dir += 10; await wait(20); if (!ok()) return;
    }
    hl(-1, -1); render(); feedback(fb, true, s.done); Sound.success(); confettiAt(cv);
  };
  root.querySelector('.go').onclick = run;
  root.querySelector('.go2').onclick = run;
  root.querySelector('.rs').onclick = () => { reset(); clearFb(fb); pred.classList.remove('hide'); };
  root._leave = () => { runId++; };
  // ارسم الحالة الأولى بعد تحميل الخط
  reset();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
};

/* التوصيل بين عمودين */
RENDER.match = (s, root) => {
  const PAL = [['#6C4CF5', '#F1EDFF'], ['#0E9F9A', '#E3F7F5'], ['#E2468A', '#FDEBF3'], ['#E08A00', '#FFF4DC'], ['#3477F0', '#E6EFFE']];
  const bHTML = p => p.shape ? `<span class="m-shape">${SHAPES[p.shape]}</span><span>${p.b}</span>` : p.b;
  root.innerHTML = shell(s, `<p class="hint-line st">${s.instruction}</p>
    <div class="match">
      <div class="mcol ca">${s.pairs.map((p, i) => `<button class="mi st" data-i="${i}">${p.a}</button>`).join('')}</div>
      <div class="mcol cb"></div>
    </div>
    <div class="row-tools"><div class="fb"></div><button class="btn ghost sm rs">↺ إعادة</button></div>`);
  const ca = root.querySelector('.ca'), cb = root.querySelector('.cb'), fb = root.querySelector('.fb');
  let sa = null, sb = null, n = 0;
  const check = () => {
    if (!sa || !sb) return;
    const a = sa, b = sb; sa = sb = null; a.classList.remove('sel'); b.classList.remove('sel');
    if (a.dataset.i === b.dataset.i){
      const [mc, ms] = PAL[n % PAL.length]; n++;
      [a, b].forEach(el => { el.classList.add('matched'); el.style.setProperty('--mc', mc); el.style.setProperty('--ms', ms); el.insertAdjacentHTML('beforeend', `<span class="badge">${n}</span>`); pop(el); });
      if (n === s.pairs.length){ feedback(fb, true, 'ممتاز! وصّلتِ جميع العبارات 🎉'); Sound.success(); confettiAt(b); }
      else { feedback(fb, true); Sound.ding(); }
    } else { shake(a); shake(b); Sound.error(); feedback(fb, false); }
  };
  const pick = (el, side) => {
    if (el.classList.contains('matched')) return;
    Sound.click();
    if (side === 'a'){ if (sa) sa.classList.remove('sel'); sa = (sa === el) ? null : el; sa && sa.classList.add('sel'); }
    else { if (sb) sb.classList.remove('sel'); sb = (sb === el) ? null : el; sb && sb.classList.add('sel'); }
    check();
  };
  const build = () => {
    n = 0; sa = sb = null; clearFb(fb);
    ca.querySelectorAll('.mi').forEach(el => { el.classList.remove('matched', 'sel'); const bd = el.querySelector('.badge'); bd && bd.remove(); });
    cb.innerHTML = shuffle(s.pairs.map((_, i) => i)).map(i => `<button class="mi" data-i="${i}">${bHTML(s.pairs[i])}</button>`).join('');
    cb.querySelectorAll('.mi').forEach(el => el.onclick = () => pick(el, 'b'));
  };
  ca.querySelectorAll('.mi').forEach(el => el.onclick = () => pick(el, 'a'));
  root.querySelector('.rs').onclick = build;
  build();
};

      <div class="g-model st"><button class="btn ghost sm more">✨ اكشفي نموذج الإجابة خطوة بخطوة</button><ol class="model">${s.model.map(m => `<li>${m}</li>`).join('')}</ol></div>
    </div>
    <div class="g-side st"><div class="g-tlabel">⏱️ وقت المجموعة</div></div>
  </div>`);
  root.querySelector('.g-side').appendChild(makeTimer(s.seconds || 180));
  const lis = [...root.querySelectorAll('.model li')], more = root.querySelector('.more');
  let k = 0;
  more.onclick = () => {
    if (k < lis.length){ lis[k++].classList.add('show'); Sound.ding(); }
    if (k >= lis.length){ more.textContent = 'أحسنتنّ! 👏'; more.disabled = true; }
  };
};

/* تحدي الدقيقة */
RENDER.challenge = (s, root) => {
  root.innerHTML = shell(s, `<div class="chal">
    <div class="ch-start vis st"><div class="ch-bolt">⚡</div><p>${s.intro}</p><button class="btn big go">ابدئي التحدي ⏱️</button></div>
    <div class="ch-game"><div class="ch-top"><div class="ch-time"></div><div class="ch-bar"><i></i></div><div class="ch-score">⭐ <b>0</b></div></div>
      <div class="ch-count"></div><div class="ch-q"></div><div class="ch-opts"></div></div>
    <div class="ch-end"><div class="ch-stars"></div><h3></h3><p></p><button class="btn ghost again">↺ تحدٍّ جديد</button></div>
  </div>`);
  const wrap = root.querySelector('.chal'), st = root.querySelector('.ch-start'), gm = root.querySelector('.ch-game'), en = root.querySelector('.ch-end');
  const tEl = root.querySelector('.ch-time'), bar = root.querySelector('.ch-bar i'), sc = root.querySelector('.ch-score b');
  const qEl = root.querySelector('.ch-q'), oEl = root.querySelector('.ch-opts'), cEl = root.querySelector('.ch-count');
  let qs, i, score, left, iv, playing = false, lock = false;
  const show = el => [st, gm, en].forEach(x => x.classList.toggle('vis', x === el));
  const paint = () => { tEl.textContent = left; bar.style.width = (left / s.seconds * 100) + '%'; sc.textContent = score; wrap.classList.toggle('warn', left <= 10); };
  const finish = () => {
    if (!playing) return;
    playing = false; clearInterval(iv); wrap.classList.remove('warn');
    const r = score / qs.length, stars = r >= .8 ? 3 : r >= .5 ? 2 : 1;
    en.querySelector('.ch-stars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
    en.querySelector('h3').textContent = `${score} من ${qs.length}`;
    en.querySelector('p').textContent = r >= .8 ? 'مذهل! أنتِ مبرمجة محترفة 🏆' : r >= .5 ? 'أحسنتِ! استمري في التقدّم 💪' : 'بداية جيدة… لنحاول مرة أخرى 💜';
    show(en);
    if (r >= .5){ Sound.success(); burst(960, 420, 70); } else Sound.ding();
  };
  const ask = () => {
    if (!playing) return;
    if (i >= qs.length) return finish();
    const q = qs[i]; lock = false;
    cEl.textContent = `السؤال ${i + 1} من ${qs.length}`;
    qEl.textContent = q.q; qEl.style.animation = 'none'; void qEl.offsetWidth; qEl.style.animation = '';
    oEl.innerHTML = q.options.map(o => `<button class="ch-o">${o}</button>`).join('');
    [...oEl.children].forEach((b, k) => b.onclick = () => {
      if (lock || !playing) return; lock = true;
      const ok = k === q.answer;
      if (ok){ score++; b.classList.add('ok'); Sound.ding(); } else { b.classList.add('bad'); oEl.children[q.answer].classList.add('ok'); Sound.error(); }
      paint(); setTimeout(() => { i++; ask(); }, ok ? 600 : 1100);
    });
  };
  const start = () => {
    qs = shuffle(s.questions); i = 0; score = 0; left = s.seconds; playing = true;
    show(gm); paint(); ask();
    iv = setInterval(() => { left--; paint(); if (left <= 5 && left > 0) Sound.tick(); if (left <= 0){ Sound.bell(); finish(); } }, 1000);
  };
  root.querySelector('.go').onclick = start;
  root.querySelector('.again').onclick = start;
  root._leave = () => { playing = false; clearInterval(iv); wrap.classList.remove('warn'); show(st); };
};

/* خريطة مفاهيم للمراجعة */
RENDER.summary = (s, root) => {
  const W = 1700, H = 690, cx = W / 2, cy = H / 2, rx = 600, ry = 240, n = s.nodes.length;
  const pts = s.nodes.map((_, i) => { const a = (-90 + i * 360 / n) * Math.PI / 180; return [cx + rx * Math.cos(a), cy + ry * Math.sin(a)]; });
  root.innerHTML = shell(s, `<div class="cmap">
    <svg class="cm-lines" viewBox="0 0 ${W} ${H}">${pts.map(p => `<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}"/>`).join('')}</svg>
    <div class="cm-node center" style="left:${cx}px;top:${cy}px"><div class="cmn-in st">${s.center}</div></div>
    ${s.nodes.map((nd, i) => `<div class="cm-node" style="left:${pts[i][0]}px;top:${pts[i][1]}px"><button class="cmn-in st c${i % 6}"><span class="cmn-ic">${nd.icon}</span><b>${nd.title}</b><span class="cmn-t">${nd.text}</span></button></div>`).join('')}
  </div>`);
  root.querySelectorAll('button.cmn-in').forEach(b => b.onclick = () => { b.classList.toggle('open'); Sound.click(); });
};

/* لمحة تاريخية */
RENDER.history = (s, root) => {
  root.innerHTML = shell(s, `<div class="hist">
    <div class="h-card st"><div class="h-por">${s.portrait}</div><div><h3>${s.name}</h3><p>${s.text}</p></div></div>
    <div class="tline st">${s.timeline.map((t, i) => `${i ? '<div class="tl-bar"></div>' : ''}<div class="tl-pt"><b>${t.year}</b><span>${t.text}</span></div>`).join('')}</div>
    <div class="h-q answer-box st"><p>${s.question}</p><button class="btn reveal">إظهار الإجابة</button><div class="ans">${s.answer}</div></div>
  </div>`);
};

/* الشريحة الختامية */
RENDER.closing = (s, root) => {
  root.innerHTML = `<div class="sl-inner closing">
    <div class="cl-badge st"><span>🏆</span></div>
    <h1 class="st">${s.title}</h1>
    <p class="cl-msg st">${s.message}</p>
    <div class="cl-code st">${s.code}</div>
    ${s.quote ? `<p class="cl-quote st">${s.quote}</p>` : ''}
    <p class="cl-next st">${s.next}</p>
    <button class="btn big clapme st">👏 صفّقن لأنفسكنّ</button>
  </div>`;
  root.querySelector('.clapme').onclick = clap;
  let t;
  root._enter = () => { t = setTimeout(rain, 500); };
  root._leave = () => clearTimeout(t);
};

/* =====================================================================
   🎬 التنقل بين الشرائح
   ===================================================================== */
const els = [];
let cur = -1;

function fit(){
  SCALE = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  stage.style.transform = `translate(-50%,-50%) scale(${SCALE})`;
}

function build(){
  SLIDES.forEach((s, i) => {
    const el = document.createElement('section');
    el.className = 'slide slide-' + s.type;
    el.dataset.fx = s.fx || 'slide';
    try { (RENDER[s.type] || ((s, r) => { r.innerHTML = shell({ title: 'نوع شريحة غير معروف: ' + s.type }, ''); }))(s, el); }
    catch (err){ console.error('خطأ في الشريحة', i + 1, err); el.innerHTML = shell({ title: '⚠️ خطأ في الشريحة ' + (i + 1) }, `<p class="hint-line">${err.message}</p>`); }
    el.insertAdjacentHTML('afterbegin', DECO_HTML);
    el.querySelectorAll('.st').forEach((e, k) => e.style.setProperty('--i', k));
    // أزرار "إظهار الإجابة" العامة
    el.querySelectorAll('.answer-box').forEach(bx => { const r = bx.querySelector('.reveal'); if (r) r.addEventListener('click', () => { bx.classList.add('open'); Sound.ding(); }); });
    box.appendChild(el); els.push(el);
  });
}

function go(n){
  if (n < 0 || n >= els.length || n === cur) return;
  const dir = n > cur ? 1 : -1, old = els[cur], nw = els[n];
  box.style.setProperty('--dir', dir);
  if (old){
    old.classList.remove('active'); old.classList.add('leave');
    setTimeout(() => old.classList.remove('leave'), 750);
    old.querySelectorAll('.timer').forEach(t => t._pause && t._pause());
    old._leave && old._leave();
  }
  nw.style.transition = 'none'; nw.classList.remove('leave'); void nw.offsetWidth; nw.style.transition = '';
  nw.classList.add('active');
  cur = n;
  nw._enter && nw._enter();
  $('#count').innerHTML = `<b>${n + 1}</b> / ${els.length}`;
  $('#progress i').style.width = ((n + 1) / els.length * 100) + '%';
  $('#btnPrev').disabled = n === 0;
  $('#btnNext').disabled = n === els.length - 1;
  try { history.replaceState(null, '', '#' + (n + 1)); } catch (e) {}
}
const next = () => go(cur + 1), prev = () => go(cur - 1);

/* لوحة المفاتيح */
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k === 'ArrowRight' || k === ' ' || k === 'Spacebar' || k === 'PageDown'){ e.preventDefault(); next(); }
  else if (k === 'ArrowLeft' || k === 'PageUp'){ e.preventDefault(); prev(); }
  else if (k === 'ArrowUp' || k === 'ArrowDown'){ e.preventDefault(); }
  else if (k === 'Home'){ e.preventDefault(); go(0); }
  else if (k === 'End'){ e.preventDefault(); go(els.length - 1); }
  else if (k === 'ت' || k === 't' || k === 'T'){ e.preventDefault(); clap(); }
});
/* إزالة التركيز عن الأزرار بعد النقر حتى لا يضغطها زر Space */
document.addEventListener('click', e => { const b = e.target.closest('button'); if (b) b.blur(); });
/* منع التمرير بعجلة الماوس أو اللمس */
window.addEventListener('wheel', e => e.preventDefault(), { passive: false });
document.addEventListener('touchmove', e => { if (!e.target.closest('input')) e.preventDefault(); }, { passive: false });

/* أزرار الشريط */
$('#btnNext').onclick = next;
$('#btnPrev').onclick = prev;
$('#btnClap').onclick = clap;
$('#btnFull').onclick = () => {
  if (!document.fullscreenElement) (document.documentElement.requestFullscreen || function(){}).call(document.documentElement);
  else document.exitFullscreen && document.exitFullscreen();
};

/* إخفاء شريط التحكم تلقائياً عند عدم تحريك الماوس */
let idleT;
function wake(){
  document.body.classList.remove('idle');
  clearTimeout(idleT);
  idleT = setTimeout(() => { if (!$('#bar').matches(':hover')) document.body.classList.add('idle'); }, 2800);
}
['mousemove', 'pointerdown', 'touchstart'].forEach(ev => window.addEventListener(ev, wake, { passive: true }));

/* تشغيل */
window.addEventListener('resize', fit);
fit();
build();
const startAt = parseInt(location.hash.slice(1), 10) - 1;
go(startAt >= 0 && startAt < els.length ? startAt : 0);
wake();
</script>
</body>
