<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رحلة مترو الرياض</title>
<!-- خط عربي واضح (إذا لم يتوفر الإنترنت سيُستخدم خط النظام تلقائياً) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

<style>
/* =========================================================
   1) الألوان والخطوط العامة
   ========================================================= */
:root{
  --bg:#F5F6FB; --ink:#1F1A4D; --muted:#5E5A80; --line:#E3E1F2; --card:#FFFFFF;
  --pr:#6C4CF5; --pr-s:#EEEAFE;
  --teal:#0E9F9A; --teal-s:#DDF5F3;
  --pink:#E2468A; --pink-s:#FDE8F1;
  --amber:#F2A20C; --amber-s:#FFF2D6;
  --blue:#3477F0; --blue-s:#E2ECFE;
  --ok:#16A34A; --ok-s:#DCFCE7;
  --bad:#E11D48; --bad-s:#FFE4EA;
  --code:#1B1740;
  --shadow:0 14px 40px rgba(46,35,120,.10);
  --font:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;
  --mono:Consolas,Menlo,'Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--ink)}
body{user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;text-align:inherit}
mark{background:linear-gradient(transparent 55%,#FFE08A 55%);color:inherit;padding:0 4px}

/* =========================================================
   2) منصة العرض 16:9 (تُكبَّر وتُصغَّر تلقائياً لتملأ الشاشة)
   ========================================================= */
#stage{
  position:absolute;left:50%;top:50%;width:1920px;height:1080px;
  transform-origin:center center;overflow:hidden;background-color:var(--bg);
  background-image:radial-gradient(circle,rgba(108,76,245,.10) 2px,transparent 2.6px);
  background-size:44px 44px;
}
#slides{position:absolute;inset:0}
#progress{position:absolute;top:0;left:0;right:0;height:7px;background:rgba(108,76,245,.10);z-index:40}
#progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--pr),var(--teal));transition:width .6s ease}
#fx{position:absolute;inset:0;pointer-events:none;z-index:60;overflow:hidden}

/* ---------- الشرائح وانتقالاتها ---------- */
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .55s ease,transform .7s cubic-bezier(.2,.8,.2,1),visibility 0s linear .7s}
.slide[data-fx="slide"]{transform:translateX(calc(var(--dir,1) * -110px))}
.slide[data-fx="zoom"]{transform:scale(.92)}
.slide.leave[data-fx="slide"]{transform:translateX(calc(var(--dir,1) * 110px))}
.slide.leave[data-fx="zoom"]{transform:scale(1.06)}
.slide.active{opacity:1;visibility:visible;pointer-events:auto;transform:none;
  transition:opacity .55s ease .1s,transform .7s cubic-bezier(.2,.8,.2,1),visibility 0s}

/* ظهور العناصر بالتتابع عند دخول الشريحة */
.slide.active .st{animation:rise .7s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(min(var(--i,0),12) * 90ms + 200ms)}
@keyframes rise{from{opacity:0;transform:translateY(34px)}}
@keyframes bob{50%{transform:translateY(-14px)}}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes floaty{50%{transform:translateY(-18px) rotate(-4deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes glow{50%{filter:drop-shadow(0 0 18px #FFE066)}}

.sl-inner{position:absolute;inset:0;padding:54px 110px 132px;display:flex;flex-direction:column;gap:24px;z-index:1}
.sb{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:22px}

/* رموز برمجية زخرفية خفيفة في الخلفية */
.deco{position:absolute;inset:0;pointer-events:none;z-index:0;font-family:var(--mono);font-weight:700;color:var(--pr)}
.deco span{position:absolute;opacity:.06;font-size:140px;line-height:1}
.deco span:nth-child(1){top:70px;left:70px}
.deco span:nth-child(2){bottom:150px;left:170px;font-size:110px;color:var(--teal)}
.deco span:nth-child(3){bottom:125px;right:80px;font-size:96px;color:var(--pink)}
.deco span:nth-child(4){top:46%;left:26px;font-size:80px;color:var(--amber)}
.slide.active .deco span:nth-child(odd){animation:floaty 9s ease-in-out infinite}
.slide.active .deco span:nth-child(even){animation:floaty 11s ease-in-out infinite reverse}

/* ---------- عنوان الشريحة ---------- */
.sh{display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.chip{display:inline-flex;align-items:center;gap:10px;background:var(--pr-s);color:var(--pr);font-weight:800;font-size:26px;padding:10px 24px;border-radius:999px}
.chip b{font-family:var(--mono)}
.sh h2{font-size:64px;font-weight:900;line-height:1.2;position:relative;padding-bottom:14px}
.sh h2::after{content:'';position:absolute;right:0;bottom:0;width:130px;height:8px;border-radius:8px;background:linear-gradient(90deg,var(--teal),var(--pr))}

/* ---------- أزرار عامة ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;font-size:30px;font-weight:800;padding:16px 34px;border-radius:999px;background:var(--pr);color:#fff;box-shadow:0 8px 20px rgba(108,76,245,.28);transition:transform .2s,box-shadow .2s,background .2s;white-space:nowrap}
.btn:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(108,76,245,.35)}
.btn:active{transform:scale(.95)}
.btn.ghost{background:#fff;color:var(--pr);box-shadow:inset 0 0 0 3px var(--pr-s)}
.btn.ghost:hover{box-shadow:inset 0 0 0 3px var(--pr)}
.btn.teal{background:var(--teal);box-shadow:0 8px 20px rgba(14,159,154,.3)}
.btn.big{font-size:40px;padding:24px 56px}
.btn.sm{font-size:24px;padding:12px 24px}
.btn[disabled]{opacity:.45;pointer-events:none}

.card{background:#fff;border-radius:28px;box-shadow:var(--shadow)}
.fb{min-height:56px;font-size:34px;font-weight:800;text-align:center;opacity:0;transform:translateY(8px);transition:.3s}
.fb.show{opacity:1;transform:none}
.fb.ok{color:var(--ok)} .fb.no{color:var(--pink)}
.row-tools{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:64px}
.row-tools .fb{flex:1;text-align:start}
.hint-line{font-size:30px;font-weight:700;color:var(--muted);text-align:center}
.defline{font-size:34px;line-height:1.55;background:#fff;border-radius:22px;padding:18px 30px;box-shadow:var(--shadow);border-inline-start:10px solid var(--pr)}
.lesson{display:none;background:var(--ok-s);border-radius:22px;padding:18px 24px;font-size:28px;font-weight:800;line-height:1.5;color:#14532D}
.lesson.show{display:block;animation:rise .5s}
.note{background:var(--blue-s);border-radius:22px;padding:18px 24px;font-size:28px;line-height:1.5;font-weight:600}
.note b{color:var(--blue)}
.answer-box{display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.answer-box .ans{display:none;font-size:34px;line-height:1.6;background:var(--ok-s);border-radius:24px;padding:20px 30px;border-inline-start:10px solid var(--ok);font-weight:600}
.answer-box.open .ans{display:block;animation:rise .5s}
.answer-box.open .reveal{display:none}
.emoji-xl{font-size:220px;line-height:1;animation:bob 3s ease-in-out infinite}

/* ---------- المؤقت ---------- */
.timer{display:flex;flex-direction:column;align-items:center;gap:16px}
.tring{position:relative;width:220px;height:220px}
.tring svg{width:100%;height:100%}
.trk{fill:#fff;stroke:var(--line);stroke-width:10}
.tval{fill:none;stroke:var(--teal);stroke-width:10;stroke-linecap:round;transform:rotate(-90deg);transform-origin:60px 60px;transition:stroke-dashoffset 1s linear,stroke .3s}
.timer.warn .tval{stroke:var(--pink)}
.tnum{position:absolute;inset:0;display:grid;place-items:center;font-size:62px;font-weight:900;font-family:var(--mono)}
.timer.warn .tnum{color:var(--pink);animation:pulse 1s infinite}
.timer.done .tring{animation:pulse .8s 3}
.tbtns{display:flex;gap:12px}
.tbtns .btn{font-size:24px;padding:12px 24px}
.g-tlabel{font-size:28px;font-weight:800;color:var(--muted)}

/* ---------- الشريحة الترحيبية ---------- */
.title-sl{flex-direction:row;align-items:center;justify-content:space-between;gap:70px;padding:80px 130px 140px}
.ttl-text{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:26px}
.title-sl h1{font-size:128px;font-weight:900;line-height:1.15}
.hl{background:linear-gradient(90deg,var(--pink),var(--pr));-webkit-background-clip:text;background-clip:text;color:transparent}
.ttl-sub{font-size:40px;font-weight:700;color:var(--muted)}
.ttl-tags{display:flex;gap:14px;flex-wrap:wrap}
.ttl-tags span{font-size:28px;font-weight:800;background:#fff;border:3px solid var(--line);border-radius:999px;padding:10px 24px}
.ttl-teacher{font-size:30px;color:var(--pr);font-weight:800}
.code-win{position:relative;width:780px;background:var(--code);border-radius:30px;box-shadow:0 30px 60px rgba(27,23,64,.35);overflow:visible}
.cw-top{display:flex;align-items:center;gap:10px;padding:20px 26px;border-bottom:1px solid rgba(255,255,255,.08);direction:ltr}
.cw-top i{width:16px;height:16px;border-radius:50%;background:#FF6B6B}
.cw-top i:nth-child(2){background:#FFD45C}.cw-top i:nth-child(3){background:#4ADE80}
.cw-top span{margin-left:14px;color:#8A86B5;font-family:var(--mono);font-size:22px}
.cw-body{padding:26px 30px 40px;min-height:420px;font-size:32px;line-height:1.95;color:#E6E3FF;font-weight:700;white-space:pre}
.cl{display:flex;align-items:center}
.ln{font-family:var(--mono);color:#5D5890;font-size:22px;width:44px;flex:none}
.tk-cm{color:#8A86B5;font-weight:500}.tk-kw{color:#C4A5FF}.tk-fn{color:#6EE7F0}.tk-str{color:#A7F3B5}
.tk-num{color:#FDBA74}.tk-ev{color:#FFD45C}.tk-ok{color:#86EFAC}
.caret{display:inline-block;width:4px;height:1.1em;background:#fff;margin-inline-start:4px;animation:blink 1s steps(1) infinite;vertical-align:middle}
.cw-cat{position:absolute;bottom:-50px;left:-40px;font-size:120px;animation:bob 2.6s ease-in-out infinite}

/* ---------- مراجعة الدرس السابق ---------- */
.review-sl{align-items:center;justify-content:center;text-align:center;gap:26px}
.review-sl h1{font-size:130px;font-weight:900;line-height:1.2}
.rv-sub{font-size:52px;font-weight:800;color:var(--muted);background:#fff;padding:16px 44px;border-radius:999px;box-shadow:var(--shadow)}
.rv-ic span{display:inline-block;font-size:150px;animation:bob 2.4s ease-in-out infinite}
.rq{position:absolute;font-weight:900;opacity:.22;line-height:1;pointer-events:none}
.slide.active .rq{animation:floaty 4s ease-in-out infinite}

/* ---------- شريحة المفهوم (اسم + معنى بسيط + مثال) ---------- */
.idea-sl{flex-direction:row;align-items:center;gap:70px;padding:60px 120px 140px}
.id-main{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:20px}
.id-term{font-size:120px;font-weight:900;line-height:1.15;color:var(--ink)}
.id-box{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:22px}
.id-ask{font-size:46px;font-weight:800;color:var(--muted)}
.id-hidden{display:none;width:100%;flex-direction:column;gap:22px}
.id-box.open .id-hidden{display:flex;animation:rise .55s}
.id-box.open .reveal{display:none}
.id-box.open .id-ask{display:none}
.id-simple{font-size:58px;font-weight:900;line-height:1.45;background:#fff;border-radius:32px;padding:26px 40px;box-shadow:var(--shadow)}
.id-ex{display:flex;align-items:center;gap:24px;background:var(--amber-s);border-radius:28px;padding:20px 30px}
.id-ex-ic{font-size:76px;flex:none}
.id-ex-c{font-size:36px;font-weight:700;line-height:1.5}
.id-ex-c b{color:#9A5B00}
.id-steps{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.id-st{display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:8px 20px;font-size:30px;font-weight:800}
.id-st i{font-style:normal;width:40px;height:40px;border-radius:50%;background:var(--amber);color:#fff;display:grid;place-items:center;font-size:24px}
.id-ar{font-size:30px;color:#9A5B00;font-weight:900}
.idea-sl .flow{justify-content:flex-start;margin-top:4px}
.idea-sl .fl{width:170px;min-height:80px;font-size:23px}
.id-chips{display:flex;gap:14px;direction:ltr;justify-content:flex-end;width:100%}
.id-chips span{font-family:var(--mono);font-size:30px;font-weight:700;background:var(--code);color:#A7F3B5;border-radius:14px;padding:8px 22px}
.id-book{font-size:27px;font-weight:600;color:var(--muted);line-height:1.5}
.id-vis{position:relative;flex:0 0 520px;height:520px;display:grid;place-items:center}
.id-circle{width:440px;height:440px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--pr-s) 70%);display:grid;place-items:center;box-shadow:0 30px 60px rgba(108,76,245,.18),inset 0 0 0 14px #fff}
.id-circle span{font-size:230px;line-height:1;animation:bob 3s ease-in-out infinite}
.id-vis .idq{position:absolute;font-size:90px;font-weight:900;opacity:.35}
.slide.active .id-vis .idq{animation:floaty 3.5s ease-in-out infinite}
.idq.a{top:0;right:20px;color:var(--pink)}.idq.b{bottom:30px;left:0;color:var(--teal);animation-delay:.8s!important}.idq.c{top:60px;left:30px;color:var(--amber);font-size:60px;animation-delay:1.4s!important}

/* ---------- مقارنة مفهومين ---------- */
.cmp{display:flex;align-items:stretch;gap:30px}
.cmp-card{flex:1;border-radius:40px;padding:40px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;box-shadow:var(--shadow)}
.cmp-card.k0{background:linear-gradient(170deg,#fff,var(--teal-s))}
.cmp-card.k1{background:linear-gradient(170deg,#fff,var(--pr-s))}
.cmp-ic{font-size:110px;line-height:1}
.cmp-card h3{font-size:62px;font-weight:900}
.cmp-def{font-size:40px;font-weight:800;line-height:1.45}
.cmp-ex{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;margin-top:6px}
.cmp-ex span{background:#fff;border-radius:20px;padding:14px;font-size:32px;font-weight:800;box-shadow:0 4px 0 var(--line)}
.cmp-vs{align-self:center;width:110px;height:110px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:40px;font-weight:900;flex:none}
.cmp-tip{font-size:40px;font-weight:800;text-align:center;color:var(--ink)}

/* ---------- رحلة مترو الرياض ---------- */
.metro{position:absolute;inset:0;z-index:1;overflow:hidden;background:linear-gradient(180deg,#CFE7F6 0%,#EAF5FC 60%,#EAF5FC 100%)}
.mt-sky{position:absolute;left:0;right:0;top:330px;height:330px;background-size:cover;background-position:center bottom;opacity:.8;-webkit-mask-image:linear-gradient(transparent,#000 35%);mask-image:linear-gradient(transparent,#000 35%)}
.mt-head{position:absolute;top:46px;right:110px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.mt-head h2{font-size:62px;font-weight:900}
.mt-map{position:absolute;top:220px;left:130px;right:130px;display:flex;justify-content:space-between}
.mt-line{position:absolute;top:30px;left:40px;right:40px;height:12px;border-radius:12px;background:linear-gradient(90deg,#8E3E96,#43B02A,#FFC72C,#FF8200,#E4002B,#0072CE)}
.mt-st{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;width:200px}
.mt-dot{width:72px;height:72px;border-radius:50%;background:#fff;border:8px solid var(--lc);display:grid;place-items:center;font-size:30px;font-weight:900;color:var(--lt);transition:.4s;box-shadow:0 6px 14px rgba(0,0,0,.12)}
.mt-st small{font-size:24px;font-weight:800;background:rgba(255,255,255,.9);padding:4px 16px;border-radius:999px;white-space:nowrap}
.mt-st.done .mt-dot{background:var(--lc);color:var(--tc);transform:scale(1.12);box-shadow:0 0 0 8px rgba(255,255,255,.7),0 0 26px var(--lc)}
.mt-plat{position:absolute;left:0;right:0;top:842px;bottom:0;background:linear-gradient(#E6EAF1,#CDD4DF);border-top:14px solid #FFC72C}
.mt-plat::before{content:'';position:absolute;left:0;right:0;top:0;height:6px;background:repeating-linear-gradient(90deg,#1F1A4D 0 30px,transparent 30px 60px);opacity:.25}
.mt-train-wrap{position:absolute;left:0;right:0;top:596px}
.mt-train{position:relative;display:flex;gap:16px;justify-content:center;transform:translateX(-135%)}
.metro.arrived .mt-train{transform:none;transition:transform 2.6s cubic-bezier(.15,.7,.25,1)}
.metro.departed .mt-train{transform:translateX(140%);transition:transform 2.8s cubic-bezier(.6,0,.85,.4)}
.mt-train::before{content:'';position:absolute;left:7%;right:7%;top:138px;height:14px;background:#3A4356;z-index:-1;border-radius:6px}
.mt-rail{position:absolute;left:0;right:0;top:218px;height:28px;background:linear-gradient(#B4BCC9,#7D8696) 0 0/100% 10px no-repeat,repeating-linear-gradient(90deg,#6B5440 0 24px,transparent 24px 58px) 0 10px/100% 18px no-repeat}
.mt-car{position:relative;width:262px;height:198px;border-radius:28px;flex:none;background:linear-gradient(180deg,#fff 0%,#F0F3F8 65%,#D8DEE8 100%);box-shadow:0 18px 30px rgba(20,30,60,.22),inset 0 -6px 0 rgba(0,0,0,.05);transition:transform .3s,box-shadow .3s}
.metro.arrived:not(.departed) .mt-car:hover{transform:translateY(-12px);box-shadow:0 30px 40px rgba(20,30,60,.28),0 0 0 6px var(--lc)}
.mt-car.head{border-top-right-radius:100px}
.mt-car.tail{border-top-left-radius:100px}
.mt-num{position:absolute;top:-28px;left:50%;transform:translateX(-50%);width:60px;height:60px;border-radius:50%;background:var(--lc);color:var(--tc);font-size:30px;font-weight:900;display:grid;place-items:center;border:5px solid #fff;box-shadow:0 6px 14px rgba(0,0,0,.2);z-index:2}
.mt-win{position:absolute;top:46px;width:64px;height:64px;border-radius:14px;background:linear-gradient(135deg,#1E3A5F,#3B6EA5 60%,#9CC3EA);box-shadow:inset 0 0 0 4px #CBD3DF;overflow:hidden;transition:background .6s}
.mt-win::after{content:'';position:absolute;top:6px;left:10px;width:16px;height:70px;background:rgba(255,255,255,.35);transform:rotate(25deg)}
.mt-win.w1{right:20px}.mt-win.w2{left:20px}
.head .w1{border-top-right-radius:58px;width:74px}
.tail .w2{border-top-left-radius:58px;width:74px}
.mt-door{position:absolute;top:32px;left:50%;transform:translateX(-50%);width:88px;height:140px;display:flex;gap:3px;overflow:hidden;border-radius:12px 12px 0 0;background:linear-gradient(#FFE9A8,#E2B866);direction:ltr;z-index:1}
.mt-door i{flex:1;background:linear-gradient(#ECF0F5,#D1D8E2);position:relative;transition:transform .5s ease}
.mt-door i::after{content:'';position:absolute;top:14px;left:7px;right:7px;height:54px;border-radius:8px;background:linear-gradient(135deg,#1E3A5F,#6E9BCB)}
.mt-car.open .mt-door .dl{transform:translateX(-105%)}
.mt-car.open .mt-door .dr{transform:translateX(105%)}
.mt-band{position:absolute;left:0;right:0;bottom:32px;height:18px;background:var(--lc)}
.mt-lbl{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:20px;font-weight:800;color:var(--muted)}
.mt-ok{display:none;position:absolute;top:-16px;right:-10px;width:52px;height:52px;border-radius:50%;background:var(--ok);color:#fff;place-items:center;font-size:28px;font-weight:900;border:4px solid #fff;z-index:3}
.mt-car.done .mt-ok{display:grid;animation:pulse .6s 2}
.mt-car.done .mt-win{background:linear-gradient(135deg,#FFE9A8,#FFC94D)}
.mt-bogie{position:absolute;bottom:-22px;width:74px;height:26px;border-radius:0 0 14px 14px;background:radial-gradient(circle at 20px 16px,#666 9px,transparent 10px),radial-gradient(circle at 54px 16px,#666 9px,transparent 10px),#2E3446}
.mt-bogie.b1{right:24px}.mt-bogie.b2{left:24px}
.mt-light{position:absolute;bottom:62px;width:18px;height:12px;border-radius:6px;background:#FFF3B0;box-shadow:0 0 18px 6px rgba(255,236,150,.8)}
.head .mt-light{right:10px}.tail .mt-light{left:10px}
.mt-hint{position:absolute;top:900px;left:0;right:0;text-align:center;font-size:36px;font-weight:800;color:var(--ink);transition:opacity .4s}
.metro.departed .mt-hint{opacity:0}
/* التذكرة */
.mt-ticket{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;background:rgba(207,231,246,.75);backdrop-filter:blur(4px);transition:opacity .6s,transform .6s}
.mt-ticket.hide{opacity:0;transform:translateY(-60px);pointer-events:none}
.tk{position:relative;display:flex;width:1100px;background:#fff;border-radius:34px;box-shadow:0 30px 70px rgba(20,30,60,.25);overflow:hidden;animation:bob 4s ease-in-out infinite}
.tk::before{content:'';position:absolute;top:0;left:0;right:0;height:16px;background:linear-gradient(90deg,#8E3E96 0 16.6%,#43B02A 16.6% 33.3%,#FFC72C 33.3% 50%,#FF8200 50% 66.6%,#E4002B 66.6% 83.3%,#0072CE 83.3%)}
.tk-main{flex:1;padding:50px 54px 40px;display:flex;flex-direction:column;gap:18px}
.tk-top{display:flex;align-items:center;gap:18px;margin-bottom:8px}
.tk-logo{font-size:70px}
.tk-top b{font-size:56px;font-weight:900}
.tk-top em{font-style:normal;font-family:var(--mono);color:var(--muted);font-size:24px;margin-inline-start:auto}
.tk-row{display:flex;justify-content:space-between;align-items:center;font-size:32px;border-bottom:2px dashed var(--line);padding-bottom:12px}
.tk-row span{color:var(--muted);font-weight:700}
.tk-row b{font-weight:900}
.tk-stub{width:250px;border-inline-start:4px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);position:relative}
.tk-stub::before,.tk-stub::after{content:'';position:absolute;right:-22px;width:40px;height:40px;border-radius:50%;background:rgba(207,231,246,1)}
.tk-stub::before{top:-20px}.tk-stub::after{bottom:-20px}
.tk-bar{width:150px;height:150px;background:repeating-linear-gradient(90deg,#1F1A4D 0 5px,transparent 5px 9px,#1F1A4D 9px 11px,transparent 11px 17px,#1F1A4D 17px 25px,transparent 25px 29px)}
.tk-stub span{font-size:26px;font-weight:800;color:var(--pr)}
.tk-stamp{position:absolute;top:50%;left:42%;transform:translate(-50%,-50%) rotate(-14deg) scale(2.4);font-size:64px;font-weight:900;color:var(--ok);border:8px solid var(--ok);border-radius:24px;padding:6px 34px;opacity:0;transition:.45s cubic-bezier(.3,1.6,.5,1);background:rgba(255,255,255,.85)}
.tk-stamp.on{opacity:1;transform:translate(-50%,-50%) rotate(-14deg) scale(1)}
/* داخل المقطورة */
.mt-inside{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;padding:48px 110px 0;gap:26px}
.mt-inside.show{display:flex;animation:inZoom .6s cubic-bezier(.2,.8,.2,1)}
@keyframes inZoom{from{opacity:0;transform:scale(.3)}}
.in-bg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:-2}
.in-shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(15,20,40,.6),rgba(15,20,40,.15) 45%,rgba(15,20,40,.55))}
.in-x{position:absolute;top:48px;right:60px}
.in-led{background:#0D0F14;border:6px solid #2B2F3A;border-radius:18px;padding:14px 40px;color:#FFB020;font-size:34px;font-weight:800;display:flex;gap:20px;align-items:center;text-shadow:0 0 12px rgba(255,176,32,.75);box-shadow:0 10px 30px rgba(0,0,0,.45);background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.6px);background-size:6px 6px}
.led-dot{width:16px;height:16px;border-radius:50%;background:#FF4040;box-shadow:0 0 10px #FF4040;animation:blink 1s steps(1) infinite}
.in-q{background:rgba(255,255,255,.96);border-radius:36px;padding:26px 60px 34px;font-size:56px;font-weight:900;line-height:1.45;text-align:center;max-width:1500px;box-shadow:0 20px 50px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;gap:8px}
.in-q .qn{font-size:26px;background:var(--lc);color:var(--tc);padding:6px 22px;border-radius:999px}
.in-seats{display:flex;gap:130px}
.seat{display:flex;flex-direction:column;align-items:center;transition:transform .25s;filter:drop-shadow(0 18px 18px rgba(0,0,0,.35))}
.seat:hover{transform:translateY(-12px)}
.seat-back{position:relative;width:380px;height:220px;border-radius:70px 70px 26px 26px;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(0,0,0,.12)),var(--lc);box-shadow:inset 0 0 0 12px rgba(255,255,255,.16),inset 0 -24px 0 rgba(0,0,0,.12);display:grid;place-items:center;color:var(--tc);font-size:48px;font-weight:900;padding:30px 24px 10px;text-shadow:0 2px 6px rgba(0,0,0,.2)}
.seat-back::before{content:'';position:absolute;top:-30px;left:50%;transform:translateX(-50%);width:170px;height:50px;border-radius:24px 24px 12px 12px;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(0,0,0,.05)),var(--lc)}
.seat-cush{width:430px;height:66px;margin-top:-6px;border-radius:26px;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(0,0,0,.25)),var(--lc)}
.seat-leg{width:46px;height:46px;background:linear-gradient(90deg,#8A94A6,#C5CCD8,#8A94A6);border-radius:0 0 10px 10px}
.seat.ok .seat-back{box-shadow:inset 0 0 0 12px rgba(255,255,255,.16),0 0 0 10px #22C55E,0 0 40px #22C55E}
.seat.ok .seat-back::after{content:'✔';position:absolute;top:-34px;right:-26px;width:76px;height:76px;border-radius:50%;background:#22C55E;color:#fff;display:grid;place-items:center;font-size:42px;border:6px solid #fff}
.seat.no{opacity:.55;filter:grayscale(.6)}
.seat.dim{opacity:.4}
.in-res{display:flex;align-items:center;gap:24px;background:rgba(255,255,255,.96);border-radius:999px;padding:12px 16px 12px 36px;box-shadow:0 10px 30px rgba(0,0,0,.25);visibility:hidden}
.in-res.show{visibility:visible;animation:rise .4s}
.in-res .fb{min-height:0;opacity:1;transform:none;font-size:36px}
.in-why{font-size:30px;font-weight:700;color:var(--muted)}
.in-back{display:none}
.in-res.solved .in-back{display:inline-flex}
/* نهاية الرحلة */
.mt-done{position:absolute;left:50%;top:640px;transform:translate(-50%,-50%);z-index:12;display:none;flex-direction:column;align-items:center;gap:16px;background:#fff;border-radius:40px;padding:40px 80px;box-shadow:0 30px 70px rgba(20,30,60,.25);text-align:center}
.mt-done.show{display:flex;animation:inZoom .6s cubic-bezier(.3,1.4,.5,1)}
.mt-done .big{font-size:110px;line-height:1}
.mt-done h3{font-size:60px;font-weight:900}
.mt-done p{font-size:34px;font-weight:700;color:var(--muted)}

/* ---------- القوانين الصفية ---------- */
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
.rule{background:#fff;border-radius:30px;box-shadow:var(--shadow);padding:34px;display:flex;align-items:center;gap:26px;font-size:38px;font-weight:800;line-height:1.35;min-height:200px;transition:transform .25s}
.rule:hover{transform:translateY(-6px)}
.ric{width:120px;height:120px;border-radius:32px;display:grid;place-items:center;font-size:62px;background:var(--pr-s);flex:none}
.rule:nth-child(6n+2) .ric{background:var(--teal-s)}
.rule:nth-child(6n+3) .ric{background:var(--pink-s)}
.rule:nth-child(6n+4) .ric{background:var(--amber-s)}
.rule:nth-child(6n+5) .ric{background:var(--blue-s)}
.rule:nth-child(6n+6) .ric{background:var(--ok-s)}

/* ---------- بطاقات قابلة للقلب ---------- */
.banner{background:linear-gradient(90deg,var(--teal-s),var(--pr-s));border-radius:24px;padding:22px 34px;font-size:32px;font-weight:700;line-height:1.5}
.flips{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:30px}
.flip{height:390px;perspective:1600px;text-align:center}
.fi{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d}
.flip.on .fi{transform:rotateY(180deg)}
.ff{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:30px;padding:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;box-shadow:var(--shadow)}
.front{background:#fff;border:4px solid var(--line);transition:border-color .2s}
.flip:hover .front{border-color:var(--pr)}
.fic{font-size:92px;line-height:1}
.ft{font-size:36px;font-weight:800;line-height:1.4}
.front small{font-size:22px;color:var(--muted)}
.back{transform:rotateY(180deg);background:linear-gradient(160deg,var(--pr),#8B6CFF);color:#fff;font-size:32px;font-weight:700;line-height:1.55}
.flip:nth-child(4n+2) .back{background:linear-gradient(160deg,var(--teal),#2CC5B9)}
.flip:nth-child(4n+3) .back{background:linear-gradient(160deg,var(--pink),#F27BB0)}
.flip:nth-child(4n+4) .back{background:linear-gradient(160deg,#E08A00,var(--amber))}
.ask{font-size:32px;font-weight:800;color:var(--pr);text-align:center;line-height:1.5}

/* ---------- سؤال اختيار من متعدد ---------- */
.q-wrap{display:flex;gap:60px;align-items:center;height:100%}
.q-visual{flex:0 0 380px;height:100%;max-height:580px;display:grid;place-items:center;background:#fff;border-radius:40px;box-shadow:var(--shadow)}
.q-main{flex:1;display:flex;flex-direction:column;gap:22px}
.q-text{font-size:50px;font-weight:900;line-height:1.45}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.opt{display:flex;align-items:center;gap:22px;background:#fff;border:4px solid var(--line);border-radius:26px;padding:18px 28px;font-size:38px;font-weight:800;transition:transform .2s,border-color .2s,background .2s,box-shadow .2s,opacity .3s;box-shadow:0 6px 0 var(--line)}
.opt:hover{transform:translateY(-4px);border-color:var(--pr);box-shadow:0 10px 0 var(--pr-s)}
.opt:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line)}
.oic{font-size:52px;width:80px;height:80px;display:grid;place-items:center;background:var(--bg);border-radius:20px;flex:none}
.oic svg{width:70px;height:40px}
.opt.correct{background:var(--ok-s);border-color:var(--ok);box-shadow:0 6px 0 #86d9a3}
.opt.correct::after{content:'✔';margin-inline-start:auto;color:var(--ok);font-size:44px}
.opt.wrong{background:var(--bad-s);border-color:#F5A3B6}
.opt.dim{opacity:.45}
.opts.compact .opt{justify-content:center;font-size:54px;padding:16px}
.q-foot{display:flex;align-items:center;gap:20px}
.q-foot .fb{flex:1;text-align:start}
.q-tools{display:flex;gap:14px}
.explain{display:none;font-size:30px;font-weight:600;background:var(--teal-s);border-radius:20px;padding:16px 26px;line-height:1.5}
.explain.show{display:block;animation:rise .5s}
.self{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:28px;font-weight:800;background:#fff;border-radius:999px;padding:12px 22px;box-shadow:var(--shadow);align-self:flex-start}
.self-b{font-size:26px;font-weight:800;background:var(--bg);border:3px solid var(--line);border-radius:999px;padding:8px 20px;transition:.2s}
.self-b:hover{border-color:var(--pr)}
.self-b b{background:var(--pr-s);color:var(--pr);border-radius:999px;padding:0 12px;margin-inline-start:6px}

/* ---------- الأهداف ---------- */
.objs{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.obj{display:flex;align-items:center;gap:22px;background:#fff;border-radius:26px;padding:26px 30px;box-shadow:var(--shadow);border:4px solid transparent;transition:.25s}
.obj:hover{transform:translateY(-4px)}
.obj-n{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--pr);background:var(--pr-s);border-radius:14px;padding:6px 12px}
.obj-ic{font-size:54px}
.obj p{font-size:35px;font-weight:800;line-height:1.4}
.obj-ck{margin-inline-start:auto;width:52px;height:52px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;color:transparent;font-size:28px;flex:none;transition:.25s}
.obj.done{border-color:var(--ok)}
.obj.done .obj-ck{background:var(--ok);border-color:var(--ok);color:#fff}

/* ---------- الحوار والمناقشة ---------- */
.disc{display:flex;gap:56px;align-items:center;height:100%}
.disc-main{flex:1;display:flex;flex-direction:column;gap:28px}
.bubble{position:relative;background:#fff;border:4px solid var(--pr-s);border-radius:44px;padding:44px 54px;font-size:56px;font-weight:900;line-height:1.45;box-shadow:var(--shadow)}
.bubble::before{content:'؟';position:absolute;top:-62px;left:40px;font-size:120px;color:var(--pink);font-weight:900}
.hints{display:flex;gap:14px;flex-wrap:wrap}
.hints span{font-size:28px;font-weight:700;background:var(--teal-s);color:#0B6B67;padding:10px 22px;border-radius:999px}
.disc-side{flex:0 0 470px;display:flex;flex-direction:column;align-items:center;gap:26px}
.disc-timer{display:flex;flex-direction:column;align-items:center;gap:10px}
.pc{position:relative;display:flex;flex-direction:column;align-items:center}
.pc-screen{width:380px;height:240px;background:var(--code);border:16px solid #2E2A5C;border-radius:24px;display:grid;place-items:center;color:#FCA5A5;font-size:32px;font-weight:800;text-align:center;line-height:1.5}
.pc-screen .cur{animation:blink 1s steps(1) infinite;color:#fff}
.pc-neck{width:60px;height:34px;background:#2E2A5C}
.pc-base{width:200px;height:18px;border-radius:10px;background:#2E2A5C}
.floatq{position:absolute;font-size:70px;font-weight:900;color:var(--pr)}
.slide.active .floatq{animation:floaty 3s ease-in-out infinite}
.q1{top:-40px;right:-34px}.q2{top:60px;left:-64px;color:var(--pink)!important;animation-delay:.6s!important}.q3{top:-56px;left:50px;color:var(--teal)!important;animation-delay:1.2s!important}

/* ---------- التصنيف ---------- */
.sort{display:grid;grid-template-columns:460px 1fr 460px;gap:36px;height:100%;max-height:700px}
.bucket{border-radius:34px;border:4px dashed;padding:24px;display:flex;flex-direction:column;gap:16px;cursor:pointer;transition:.25s}
.bucket.b0{background:var(--teal-s);border-color:#8FDCD6}
.bucket.b1{background:var(--pr-s);border-color:#C6B8FF}
.bucket:hover,.bucket.over{transform:scale(1.02)}
.bk-h{display:flex;gap:16px;align-items:center}
.bk-ic{font-size:68px}
.bk-h h3{font-size:40px;font-weight:900}
.bk-h p{font-size:23px;color:var(--muted);line-height:1.4;font-weight:600}
.bk-items{display:flex;flex-direction:column;gap:10px}
.sort-pool{display:flex;flex-direction:column;align-items:center;gap:18px}
.pool-items{display:grid;grid-template-columns:1fr 1fr;gap:18px;width:100%;align-content:start;flex:1}
.sitem{display:flex;align-items:center;gap:14px;background:#fff;border:3px solid var(--line);border-radius:22px;padding:16px 20px;font-size:32px;font-weight:800;box-shadow:0 6px 0 var(--line);transition:.2s}
.sitem span{font-size:44px}
.sitem:hover{transform:translateY(-3px);border-color:var(--pr)}
.sitem.sel{border-color:var(--pr);background:#FBFAFF;box-shadow:0 0 0 6px rgba(108,76,245,.2);transform:translateY(-4px) scale(1.03)}
.sitem.placed{padding:8px 16px;font-size:27px;box-shadow:none;cursor:default}
.sitem.placed span{font-size:32px}
.sitem.placed:hover{transform:none}

/* ---------- المفهوم ---------- */
.concept{display:flex;flex-direction:column;gap:24px}
.defbox{background:#fff;border-radius:34px;box-shadow:var(--shadow);padding:30px 44px;display:flex;flex-direction:column;align-items:flex-start;gap:18px;border-inline-start:14px solid var(--pr)}
.def-q{font-size:42px;font-weight:800;color:var(--muted)}
.def{display:none;font-size:44px;font-weight:800;line-height:1.6}
.defbox.open .def{display:block;animation:rise .5s}
.defbox.open .reveal{display:none}
.defbox.open .def-q{font-size:28px}
.points{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.point{background:#fff;border-radius:28px;box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;border:4px solid transparent;min-height:230px;transition:.25s}
.point:hover{border-color:var(--teal)}
.pt-ic{font-size:62px}
.point b{font-size:36px;font-weight:900}
.pt-t{display:none;font-size:28px;line-height:1.5;font-weight:600}
.point.open .pt-t{display:block;animation:rise .4s}
.point.open small{display:none}
.point.open{border-color:var(--teal);background:var(--teal-s)}
.point small{font-size:22px;color:var(--muted)}

/* ---------- العصف الذهني ---------- */
.brain{display:flex;gap:40px;height:100%}
.br-side{flex:0 0 560px;display:flex;flex-direction:column;gap:18px}
.br-q{background:linear-gradient(135deg,var(--pr),#8E6BFF);color:#fff;border-radius:32px;padding:28px;font-size:38px;font-weight:800;line-height:1.5;display:flex;gap:16px;align-items:flex-start}
.bulb{font-size:62px;animation:glow 2s infinite}
.br-tools{display:flex;gap:12px}
.br-in{flex:1;font-family:inherit;font-size:28px;padding:14px 22px;border-radius:18px;border:3px solid var(--line);outline:none;direction:rtl;color:var(--ink);user-select:text}
.br-in:focus{border-color:var(--pr)}
.br-timer{display:flex;flex-direction:column;align-items:center;gap:6px}
.br-timer .tring{width:160px;height:160px}
.br-timer .tnum{font-size:46px}
.br-board{flex:1;border-radius:34px;box-shadow:var(--shadow);padding:30px;display:flex;flex-wrap:wrap;gap:20px;align-content:flex-start;overflow:hidden;background-color:#fff;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:40px 40px}
.note-s{font-size:34px;font-weight:800;padding:20px 28px;border-radius:8px 8px 22px 8px;box-shadow:0 8px 18px rgba(0,0,0,.08);transform:rotate(var(--r));animation:noteIn .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes noteIn{from{transform:scale(.2) rotate(var(--r));opacity:0}}
.br-empty{margin:auto;font-size:36px;color:var(--muted);font-weight:700}

/* ---------- لعبة القطة (اتباع التعليمات) ---------- */
.robot{display:flex;gap:40px;align-items:stretch;height:100%}
.rb-board{background:#fff;border-radius:34px;box-shadow:var(--shadow);padding:26px;display:grid;place-items:center}
.grid{display:grid;gap:8px;position:relative;direction:ltr}
.cell{width:100px;height:100px;border-radius:18px;background:#F1EFFB;display:grid;place-items:center;font-size:58px}
.cell.wall{background:#FDE4D3}
.cell.goal{background:#DDF5F3}
.slide.active .cell.goal{animation:pulse 1.6s infinite}
.cell.start{background:#EEEAFE;outline:3px dashed #C6B8FF;outline-offset:-7px}
.sprite{position:absolute;top:0;left:0;width:100px;height:100px;display:grid;place-items:center;font-size:66px;transition:transform .42s cubic-bezier(.3,1.3,.5,1);z-index:2;filter:drop-shadow(0 6px 6px rgba(0,0,0,.18))}
.rb-panel{flex:1;display:flex;flex-direction:column;gap:16px}
.rb-task{font-size:32px;font-weight:700;line-height:1.5}
.rb-levels{display:flex;gap:10px}
.lv{font-size:24px;font-weight:800;padding:8px 22px;border-radius:999px;background:#fff;border:3px solid var(--line)}
.lv.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.rb-cmds{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.rb-cmds button{background:#4C97FF;color:#fff;border-radius:18px;padding:12px 8px;font-size:40px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 6px 0 #3373CC;transition:.15s}
.rb-cmds button span{font-size:24px;font-weight:800}
.rb-cmds button:hover{transform:translateY(-2px)}
.rb-cmds button:active{transform:translateY(4px);box-shadow:0 2px 0 #3373CC}
.rb-prog{min-height:140px;max-height:220px;background:#fff;border-radius:22px;border:3px dashed #C6D8FF;padding:14px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;overflow:hidden}
.pb{background:#4C97FF;color:#fff;font-size:21px;font-weight:800;padding:5px 12px;border-radius:10px;display:flex;gap:8px;align-items:center;transition:.2s}
.pb b{background:rgba(255,255,255,.25);border-radius:6px;padding:0 8px}
.pb.run{background:#FFAB19;transform:scale(1.08)}
.ph{color:var(--muted);font-size:24px;font-weight:600}
.rb-acts{display:flex;gap:12px;align-items:center}
.rb-panel .fb{text-align:start;min-height:46px;font-size:30px}
.rb-panel.busy .rb-cmds,.rb-panel.busy .rb-acts,.rb-panel.busy .rb-levels{pointer-events:none;opacity:.6}

/* ---------- فكر زاوج شارك ---------- */
.tps{display:flex;flex-direction:column;gap:24px;height:100%;justify-content:center}
.tps-q{font-size:46px;font-weight:900;line-height:1.45;text-align:center;background:#fff;border-radius:30px;padding:26px 40px;box-shadow:var(--shadow)}
.tps-row{display:flex;gap:30px;align-items:center}
.phases{flex:1;display:flex;align-items:center;gap:14px}
.phase{flex:1;background:#fff;border-radius:28px;padding:24px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;border:4px solid var(--line);box-shadow:var(--shadow);transition:.25s;text-align:center}
.phase:hover{border-color:var(--pr)}
.ph-ic{font-size:70px}
.phase h3{font-size:40px;font-weight:900}
.phase p{font-size:26px;color:var(--muted);font-weight:600}
.ph-t{font-family:var(--mono);font-size:26px;background:var(--bg);border-radius:999px;padding:4px 16px}
.phase.on{border-color:var(--pr);background:var(--pr-s);transform:translateY(-6px)}
.ph-ar{font-size:44px;color:var(--pr)}
.tps-timer{flex:0 0 330px;display:flex;justify-content:center}

/* ---------- الترتيب ---------- */
.order{display:grid;grid-template-columns:1fr 1fr;gap:30px;flex:1;min-height:0}
.order.has-aside{grid-template-columns:1fr 1fr .95fr}
.ord-pool,.ord-ans{background:#fff;border-radius:30px;box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:12px}
.lbl{font-size:28px;font-weight:900;color:var(--pr);margin-bottom:4px}
.op-items{display:flex;flex-direction:column;gap:12px}
.oitem{font-size:29px;font-weight:800;background:var(--bg);border:3px solid var(--line);border-radius:18px;padding:12px 20px;transition:.2s}
.oitem:hover{border-color:var(--pr);transform:translateX(-6px)}
.oitem.used{opacity:.25;pointer-events:none}
.slots{list-style:none;display:flex;flex-direction:column;gap:12px}
.slots li{display:flex;align-items:center;gap:14px;min-height:62px;border:3px dashed var(--line);border-radius:18px;padding:6px 14px;font-size:29px;font-weight:800}
.slots li.filled{border-style:solid;border-color:var(--ok);background:var(--ok-s)}
.sn{width:44px;height:44px;border-radius:50%;background:var(--pr-s);color:var(--pr);display:grid;place-items:center;flex:none;font-size:24px}
.filled .sn{background:var(--ok);color:#fff}
.ord-aside{display:flex;flex-direction:column;gap:16px}
.ord-aside .defline{font-size:28px;padding:16px 22px}
.quote{background:linear-gradient(160deg,#E9F8F1,#fff);border:3px solid #BFE8D3;border-radius:26px;padding:22px;font-size:31px;line-height:1.9;font-weight:700;color:#0F5132;text-align:center}
.quote cite{display:block;font-size:22px;color:var(--muted);font-style:normal;margin-top:6px}
.predict{background:var(--amber-s);border-radius:24px;padding:20px 22px;font-size:28px;font-weight:700;line-height:1.5;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.pa{display:none;background:#fff;border-radius:16px;padding:14px 18px;font-size:26px}
.predict.open .pa{display:block;animation:rise .4s}
.predict.open .pv{display:none}

/* ---------- الرياضيات ---------- */
.math{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;height:100%}
.m-right{display:flex;flex-direction:column;gap:20px;justify-content:center}
.m-problem{font-size:37px;font-weight:800;line-height:1.6;background:#fff;border-radius:28px;padding:24px 32px;box-shadow:var(--shadow)}
.m-visual{display:flex;gap:26px;align-items:flex-end;justify-content:center;background:var(--amber-s);border-radius:28px;padding:20px}
.mbox{display:flex;flex-direction:column;align-items:center}
.mpens{display:flex;gap:2px;font-size:36px}
.mpens span{transition:.7s}
.mpens span.gone{opacity:.12;filter:grayscale(1);transform:translateY(-24px)}
.mb-ic{font-size:78px;line-height:1}
.m-friend{display:flex;flex-direction:column;align-items:center;font-size:58px;border-inline-start:3px dashed #E5C26B;padding-inline-start:24px}
.m-friend span{font-size:22px;font-weight:800}
.m-given{font-size:34px;min-height:44px}
.m-steps{display:flex;flex-direction:column;gap:14px}
.mstep{display:flex;align-items:center;gap:18px;background:#fff;border:3px solid var(--line);border-radius:22px;padding:14px 24px;font-size:32px;transition:.25s}
.mstep:hover{border-color:var(--pr)}
.mstep b{color:var(--pr);flex:none}
.ms-t{display:none;font-weight:800}
.mstep.open .ms-t{display:inline;animation:rise .4s}
.mstep.open .ms-h{display:none}
.ms-h{color:var(--muted);font-size:26px}
.mstep.open{border-color:var(--ok);background:var(--ok-s)}
.m-left{background:#fff;border-radius:30px;box-shadow:var(--shadow);padding:30px;display:flex;flex-direction:column;gap:22px;justify-content:center}
.m-left .q-text{font-size:44px}

/* ---------- أشكال المخطط الانسيابي ---------- */
.shp-i rect,.shp-i polygon{fill:#FBBF24;stroke:#C77C02;stroke-width:4}
.shp-i line{stroke:var(--ink);stroke-width:6;stroke-linecap:round}
.shp-i polygon.ah{fill:var(--ink);stroke:none}
.shapes{display:grid;grid-template-columns:repeat(5,1fr);gap:22px}
.shp{background:#fff;border-radius:28px;box-shadow:var(--shadow);padding:24px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;border:4px solid transparent;min-height:330px;transition:.25s;text-align:center}
.shp:hover{border-color:var(--amber);transform:translateY(-6px)}
.shp-svg svg{width:190px;height:104px}
.shp b{font-size:31px;font-weight:900}
.shp-d{display:none;font-size:27px;line-height:1.45;font-weight:700}
.shp.open .shp-d{display:block;animation:rise .4s}
.shp.open small{display:none}
.shp small{font-size:22px;color:var(--muted)}
.shp.open{border-color:var(--amber);background:var(--amber-s)}
.tips{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.tip{font-size:27px;font-weight:700;background:var(--blue-s);border-radius:20px;padding:16px 22px;line-height:1.45}

/* ---------- خطوات إنشاء برنامج ---------- */
.s4{display:flex;flex-direction:column;gap:24px;height:100%}
.s4-tabs{display:flex;align-items:center;justify-content:center;gap:12px}
.s4t{flex:1;max-width:370px;display:flex;align-items:center;gap:12px;background:#fff;border:4px solid var(--line);border-radius:26px;padding:16px 18px;font-size:29px;font-weight:900;position:relative;transition:.25s;box-shadow:var(--shadow)}
.s4n{width:50px;height:50px;border-radius:50%;background:var(--pr);color:#fff;display:grid;place-items:center;font-size:26px;flex:none}
.s4i{font-size:42px}
.s4t.locked{opacity:.45;filter:grayscale(1);cursor:default}
.s4lock{display:none;position:absolute;top:-16px;inset-inline-end:-8px;font-size:30px}
.s4t.locked .s4lock{display:block}
.s4t.cur{border-color:var(--pr);box-shadow:0 0 0 6px rgba(108,76,245,.15);transform:translateY(-4px)}
.s4-arrow{font-size:38px;color:var(--pr);font-weight:900}
.s4-panel{flex:1;background:#fff;border-radius:34px;box-shadow:var(--shadow);padding:30px 44px;position:relative;display:flex;flex-direction:column;gap:14px}
.s4-ex{font-size:29px;font-weight:800;color:var(--pr);background:var(--pr-s);padding:10px 24px;border-radius:16px;align-self:flex-start}
.s4-body{flex:1;font-size:35px;line-height:1.6;font-weight:600}
.s4-body.swap{animation:rise .5s}
.s4-body h3{font-size:42px;font-weight:900;margin-bottom:8px;color:var(--ink)}
.s4-body ul,.s4-body ol{padding-inline-start:10px;list-style:none;display:flex;flex-direction:column;gap:6px}
.s4-body ol{counter-reset:a}
.s4-body ol li::before{counter-increment:a;content:counter(a);display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--amber-s);color:#9A5B00;margin-inline-end:14px;font-weight:900;font-size:26px}
.s4-empty{display:grid;place-items:center;height:100%;color:var(--muted);font-size:38px;font-weight:700;text-align:center}
.s4-next{position:absolute;bottom:26px;inset-inline-end:34px}
.muted{color:var(--muted)}
.flow{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:22px}
.fl{width:205px;min-height:96px;display:grid;place-items:center;padding:14px 22px;font-size:24px;font-weight:800;text-align:center;background:#FBBF24;color:#3B2500;line-height:1.35;opacity:0;animation:flIn .5s forwards;animation-delay:calc(var(--d) * 170ms)}
@keyframes flIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.fl-t{border-radius:999px;background:#F59E0B}
.fl-io{clip-path:polygon(14% 0,100% 0,86% 100%,0 100%);padding:14px 34px}
.fl-p{border-radius:6px}
.fl-ar{font-size:34px;color:var(--ink);font-weight:900;opacity:0;animation:flIn .4s forwards;animation-delay:calc(var(--d) * 170ms)}

/* ---------- القطة ترسم القمر ---------- */
.cm{display:flex;gap:40px;height:100%}
.cm-blocks{flex:0 0 640px;background:#fff;border-radius:30px;box-shadow:var(--shadow);padding:24px 26px;display:flex;flex-direction:column;gap:5px;overflow:hidden;background-image:radial-gradient(circle,#E9E7F5 1.5px,transparent 2px);background-size:24px 24px}
.blk{display:flex;align-items:center;gap:10px;color:#fff;font-size:24px;font-weight:800;padding:8px 18px;border-radius:10px;align-self:flex-start;transition:transform .15s,box-shadow .15s;box-shadow:0 3px 0 rgba(0,0,0,.15);white-space:nowrap}
.blk .in{background:#fff;color:#333;border-radius:999px;padding:1px 14px;font-size:22px}
.in.dot{width:36px;height:26px;background:#FFF4C2;display:inline-block;border:2px solid #fff}
.ev{background:#FFBF00;color:#4a3500}
.hat{border-radius:28px 28px 10px 10px;padding-top:16px}
.pen{background:#0FBD8C}.looks{background:#9966FF}.motion{background:#4C97FF}.ctrl{background:#FFAB19}
.cblock{flex-direction:column;align-items:stretch;padding:0;gap:0}
.ctop{padding:8px 18px}
.cin{margin-inline-start:28px;background:#fff;padding:5px 0;display:flex;flex-direction:column;gap:5px;border-radius:0 0 0 0}
.cbot{height:26px;padding:0 18px;font-size:20px}
.blk.run{box-shadow:0 0 0 5px #FFE066,0 0 26px #FFD000;transform:scale(1.04)}
.cm-stage{flex:1;display:flex;flex-direction:column;gap:16px;align-items:center}
.cm-algo{display:flex;gap:12px}
.cm-algo span{font-size:24px;font-weight:800;background:#fff;border:3px solid var(--line);border-radius:999px;padding:8px 18px;display:flex;gap:10px;align-items:center;transition:.2s}
.cm-algo span b{background:var(--pr-s);color:var(--pr);border-radius:50%;width:34px;height:34px;display:grid;place-items:center}
.cm-algo span.run{border-color:var(--amber);background:var(--amber-s);transform:scale(1.07)}
.cm-cv{position:relative;width:680px;height:510px;border-radius:24px;overflow:hidden;box-shadow:var(--shadow);border:6px solid #fff;flex:none}
.cm-cv canvas{width:100%;height:100%;display:block}
.cm-predict{position:absolute;inset:0;background:rgba(27,23,64,.84);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;padding:40px;text-align:center}
.cm-predict p{font-size:40px;font-weight:800;line-height:1.5}
.cm-predict.hide{display:none}
.cm-tools{display:flex;gap:16px;align-items:center;width:680px}
.cm-tools .fb{flex:1;font-size:26px;text-align:start;min-height:40px}

/* ---------- صح أم خطأ ---------- */
.tf{display:flex;flex-direction:column;gap:16px}
.tf-row{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:8px 24px;background:#fff;border-radius:24px;padding:18px 28px;box-shadow:var(--shadow);border-inline-start:10px solid var(--line);transition:.3s}
.tf-n{width:56px;height:56px;border-radius:16px;background:var(--pr-s);color:var(--pr);display:grid;place-items:center;font-size:28px;font-weight:900}
.tf-row p{font-size:37px;font-weight:800;line-height:1.4}
.tf-btns{display:flex;gap:12px}
.tfb{font-size:30px;font-weight:800;padding:12px 28px;border-radius:999px;border:3px solid var(--line);background:#fff;transition:.2s}
.tfb.yes:hover{border-color:var(--ok);color:var(--ok)}
.tfb.no:hover{border-color:var(--bad);color:var(--bad)}
.tf-why{grid-column:2/4;display:none;font-size:26px;color:var(--muted);font-weight:700}
.tf-row.done{border-inline-start-color:var(--ok)}
.tf-row.done .tf-why{display:block;animation:rise .4s}
.tf-row.done .tfb{pointer-events:none}
.tf-row.done .tfb.on.yes{background:var(--ok);color:#fff;border-color:var(--ok)}
.tf-row.done .tfb.on.no{background:var(--bad);color:#fff;border-color:var(--bad)}

/* ---------- التوصيل ---------- */
.match{display:grid;grid-template-columns:1fr 1fr;gap:140px}
.mcol{display:flex;flex-direction:column;gap:18px}
.mi{position:relative;background:#fff;border:4px solid var(--line);border-radius:24px;min-height:108px;padding:12px 28px;font-size:34px;font-weight:800;display:flex;align-items:center;gap:22px;box-shadow:0 6px 0 var(--line);transition:.2s}
.mi:hover{border-color:var(--pr)}
.m-shape svg{width:140px;height:76px}
.mi.sel{border-color:var(--pr);box-shadow:0 0 0 6px rgba(108,76,245,.2);transform:scale(1.02)}
.mi.matched{border-color:var(--mc);background:var(--ms);cursor:default;box-shadow:none}
.mi .badge{position:absolute;inset-inline-end:-22px;top:-18px;width:52px;height:52px;border-radius:50%;background:var(--mc);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:900}

/* ---------- العمل الجماعي ---------- */
.group{display:flex;gap:44px;height:100%}
.g-main{flex:1;display:flex;flex-direction:column;gap:22px;justify-content:center}
.g-task{font-size:35px;font-weight:800;line-height:1.55;background:#fff;border-radius:28px;padding:26px 34px;box-shadow:var(--shadow);border-inline-start:12px solid var(--amber)}
.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.role{background:#fff;border-radius:22px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--shadow);text-align:center}
.role span{font-size:50px}
.role b{font-size:30px;font-weight:900}
.role small{font-size:22px;color:var(--muted);font-weight:600}
.g-model{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.model{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;list-style:none;counter-reset:m;width:100%}
.model li{visibility:hidden;opacity:0;font-size:27px;font-weight:800;background:var(--amber-s);border-radius:16px;padding:10px 18px;transition:opacity .4s;counter-increment:m}
.model li::before{content:counter(m) ". ";color:#9A5B00}
.model li.show{visibility:visible;opacity:1}
.g-side{flex:0 0 340px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#fff;border-radius:34px;box-shadow:var(--shadow)}

/* ---------- تحدي الدقيقة ---------- */
.chal{height:100%;display:flex;align-items:center;justify-content:center}
.ch-start,.ch-game,.ch-end{display:none;flex-direction:column;align-items:center;gap:26px;width:100%;max-width:1350px}
.ch-start.vis,.ch-game.vis,.ch-end.vis{display:flex}
.ch-bolt{font-size:150px;animation:bob 2s ease-in-out infinite}
.ch-start p{font-size:46px;font-weight:800;text-align:center;line-height:1.5}
.ch-top{display:flex;align-items:center;gap:30px;width:100%}
.ch-time{font-size:62px;font-weight:900;font-family:var(--mono);width:150px;text-align:center}
.ch-bar{flex:1;height:26px;border-radius:20px;background:var(--line);overflow:hidden}
.ch-bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--teal),var(--pr));transition:width 1s linear}
.chal.warn .ch-bar i{background:var(--pink)}
.chal.warn .ch-time{color:var(--pink)}
.ch-score{font-size:44px;font-weight:900;background:var(--amber-s);padding:10px 28px;border-radius:999px}
.ch-count{font-size:28px;color:var(--muted);font-weight:700}
.ch-q{font-size:60px;font-weight:900;text-align:center;line-height:1.4;animation:rise .4s}
.ch-opts{display:flex;gap:26px;flex-wrap:wrap;justify-content:center}
.ch-o{font-size:42px;font-weight:800;padding:24px 50px;border-radius:26px;background:#fff;border:4px solid var(--line);box-shadow:0 6px 0 var(--line);min-width:300px;text-align:center;transition:.2s}
.ch-o:hover{border-color:var(--pr);transform:translateY(-3px)}
.ch-o.ok{background:var(--ok-s);border-color:var(--ok)}
.ch-o.bad{background:var(--bad-s);border-color:var(--bad)}
.ch-stars{font-size:120px;letter-spacing:10px}
.ch-end h3{font-size:64px;font-weight:900}
.ch-end p{font-size:36px;color:var(--muted);font-weight:700}

/* ---------- خريطة المراجعة ---------- */
.cmap{position:relative;width:1700px;height:690px;margin:0 auto}
.cm-lines{position:absolute;inset:0;width:100%;height:100%}
.cm-lines line{stroke:#CFC7F5;stroke-width:5;stroke-dasharray:10 12}
.cm-node{position:absolute;transform:translate(-50%,-50%);z-index:1}
.cmn-in{display:flex;flex-direction:column;align-items:center;gap:4px;background:#fff;border-radius:28px;padding:16px 28px;box-shadow:var(--shadow);width:380px;border:4px solid var(--c,var(--pr));text-align:center;transition:.25s}
.cmn-in:hover{transform:translateY(-4px)}
.cmn-ic{font-size:48px;line-height:1.1}
.cmn-in b{font-size:35px;font-weight:900}
.cmn-t{display:none;font-size:26px;line-height:1.45;color:var(--muted);font-weight:700}
.cmn-in.open .cmn-t{display:block;animation:rise .4s}
.cmn-in.open{background:#FCFBFF}
.center .cmn-in{width:auto;background:linear-gradient(135deg,var(--pr),var(--pink));color:#fff;font-size:48px;font-weight:900;padding:34px 50px;border:none}
.c0{--c:var(--pr)}.c1{--c:var(--teal)}.c2{--c:var(--pink)}.c3{--c:var(--amber)}.c4{--c:var(--blue)}.c5{--c:var(--ok)}

/* ---------- لمحة تاريخية ---------- */
.hist{display:grid;grid-template-columns:1fr 1fr;gap:30px}
.h-card{grid-column:1/-1;display:flex;gap:40px;align-items:center;background:linear-gradient(135deg,var(--pink-s),#fff);border-radius:34px;padding:34px 44px;box-shadow:var(--shadow)}
.h-por{font-size:140px;width:210px;height:210px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.h-card h3{font-size:52px;font-weight:900;color:var(--pink);margin-bottom:6px}
.h-card p{font-size:35px;line-height:1.6;font-weight:600}
.tline{display:flex;align-items:center;background:#fff;border-radius:30px;padding:30px 40px;box-shadow:var(--shadow)}
.tl-pt{display:flex;flex-direction:column;align-items:center;gap:6px}
.tl-pt b{font-size:56px;font-weight:900;color:var(--pr)}
.tl-pt span{font-size:26px;font-weight:700}
.tl-bar{flex:1;height:8px;border-radius:8px;background:linear-gradient(270deg,var(--pink),var(--pr));margin:0 24px}
.h-q{background:#fff;border-radius:30px;padding:28px 32px;box-shadow:var(--shadow)}
.h-q p{font-size:33px;font-weight:800;line-height:1.5}
.h-q .ans{font-size:32px}

/* ---------- الشريحة الختامية ---------- */
.closing{align-items:center;justify-content:center;text-align:center;gap:20px}
.cl-badge span{display:inline-block;font-size:130px;animation:bob 2.5s ease-in-out infinite}
.closing h1{font-size:98px;font-weight:900;line-height:1.25;background:linear-gradient(90deg,var(--pr),var(--pink),var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent}
.cl-msg{font-size:40px;font-weight:700;color:var(--muted);max-width:1400px;line-height:1.5}
.cl-code{font-size:36px;background:var(--code);color:#A7F3B5;border-radius:20px;padding:16px 40px;font-weight:700}
.cl-quote{font-size:34px;color:var(--teal);font-weight:800}
.cl-next{font-size:31px;font-weight:700;background:var(--amber-s);padding:14px 30px;border-radius:999px}

/* =========================================================
   3) شريط التحكم والمؤشرات
   ========================================================= */
#bar{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:rgba(31,26,77,.93);padding:10px 14px;border-radius:999px;z-index:50;direction:ltr;box-shadow:0 12px 30px rgba(31,26,77,.3);transition:opacity .4s,transform .4s}
#bar button{color:#fff;font-size:26px;font-weight:800;height:60px;padding:0 24px;border-radius:999px;display:flex;align-items:center;gap:10px;transition:background .2s,transform .15s}
#bar button:hover{background:rgba(255,255,255,.14)}
#bar button:active{transform:scale(.93)}
#bar [hidden]{display:none}
#bar button[disabled]{opacity:.35;pointer-events:none}

<script>
/* =====================================================================
   🚇 استراتيجية «رحلة في مترو الرياض» — للمراجعة والتقييم
   ---------------------------------------------------------------------
   طريقة الاستخدام في الحصة:
   1) تضغط المعلمة «فعّلي التذكرة» فيصل القطار إلى المحطة.
   2) تختار الطالبة مقطورة ← تنفتح الأبواب ← يظهر السؤال داخلها.
   3) الإجابات مقاعد: تجلس الطالبة على المقعد الصحيح 💺
   4) بعد كل الأسئلة ينطلق القطار وتظهر نتيجة الرحلة.

   ✏️ للتعديل (لا حاجة لمعرفة البرمجة):
   • غيّري العنوان والراكبة والرحلة.
   • كل سؤال = مقطورة. الأفضل من 4 إلى 6 أسئلة.
   • station : اسم المحطة     • color : لون المقطورة
   • options : الخيارات (مقعدان أو ثلاثة)
   • answer  : رقم المقعد الصحيح بدءاً من 0  (الأول = 0، الثاني = 1)
   • why     : جملة قصيرة تظهر بعد الإجابة الصحيحة
   ألوان خطوط المترو: أزرق #0072CE  أحمر #E4002B  برتقالي #FF8200
                      أصفر #FFC72C  أخضر #43B02A  بنفسجي #8E3E96
   ===================================================================== */

const LESSON = {
  title: 'رحلة في مترو الرياض',
  messages: {
    correct: 'أحسنتِ! 👏 إجابة صحيحة',
    wrong:   'حاولي مرة أخرى 💜'
  }
};

const SLIDES = [
  {
    type: 'metro', fx: 'zoom',
    chip: 'مراجعة الدرس السابق',          // النص الصغير أعلى العنوان
    title: 'رحلة المراجعة في مترو الرياض', // العنوان الرئيسي
    passenger: 'طالبات الصف الخامس 👧',    // يظهر في التذكرة
    trip: 'مراجعة الدرس السابق',           // يظهر في التذكرة
    questions: [
      { station: 'قصر الحكم',      color: '#0072CE', q: 'أيّ مما يلي يُعدّ جهاز تخزين؟', options: ['💾 الفلاش', '🖥️ الشاشة'], answer: 0, why: 'الفلاش يحفظ الملفات، أما الشاشة فتعرضها.' },
      { station: 'المتحف الوطني',  color: '#E4002B', q: 'أيّ مما يلي يُعدّ جهاز إدخال؟', options: ['🖨️ الطابعة', '⌨️ لوحة المفاتيح'], answer: 1, why: 'لوحة المفاتيح ندخل بها الحروف، أما الطابعة فتُخرج الورق.' },
      { station: 'العليا',         color: '#FF8200', q: 'يمكن معرفة نوع الملف من خلال امتداده.', options: ['✔ صح', '✖ خطأ'], answer: 0, why: 'مثل: ‎.docx ملف وورد، و ‎.png صورة.' },
      { station: 'كافد',           color: '#FFC72C', q: 'عندما تكتبين قصيدة أو ترسمين لوحة، تصبح ملكاً للجميع.', options: ['✔ صح', '✖ خطأ'], answer: 1, why: 'عملكِ ملككِ أنتِ، ولا يحق لأحد أخذه دون إذنكِ.' },
      { station: 'stc',            color: '#43B02A', q: 'يُقاس حجم الملف بوحدة…', options: ['📦 البايت', '📏 المتر'], answer: 0, why: 'البايت لقياس حجم الملفات، والمتر لقياس الطول.' },
      { station: 'مطار الملك خالد', color: '#8E3E96', q: 'اللوحة الأم هي الجزء الذي ينفّذ جميع العمليات في الحاسب.', options: ['✔ صح', '✖ خطأ'], answer: 1, why: 'المعالج هو الذي ينفّذ العمليات، واللوحة الأم تربط الأجزاء ببعضها.' }
    ]
  }
];

/* =====================================================================
   ⚙️ محرك العرض — لا حاجة لتعديل ما يلي
   ===================================================================== */

/* ---------- أدوات مساعدة ---------- */
const $ = s => document.querySelector(s);
const wait = ms => new Promise(r => setTimeout(r, ms));
const fmt = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function shake(el){ el.animate([{transform:'translateX(0)'},{transform:'translateX(-14px)'},{transform:'translateX(12px)'},{transform:'translateX(-8px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}], {duration:480}); }
function pop(el){ el.animate([{transform:'scale(1)'},{transform:'scale(1.1)'},{transform:'scale(1)'}], {duration:420, easing:'ease-out'}); }
function feedback(fb, ok, text){ fb.innerHTML = text || (ok ? LESSON.messages.correct : LESSON.messages.wrong); fb.className = 'fb show ' + (ok ? 'ok' : 'no'); }
function clearFb(fb){ fb.className = 'fb'; fb.textContent = ''; }

/* أشكال المخطط الانسيابي (SVG) */
const SHAPES = {
  oval:    '<svg class="shp-i" viewBox="0 0 220 120"><rect x="8" y="14" width="204" height="92" rx="46"/></svg>',
  diamond: '<svg class="shp-i" viewBox="0 0 220 120"><polygon points="110,6 214,60 110,114 6,60"/></svg>',
  rect:    '<svg class="shp-i" viewBox="0 0 220 120"><rect x="8" y="16" width="204" height="88" rx="4"/></svg>',
  para:    '<svg class="shp-i" viewBox="0 0 220 120"><polygon points="52,14 214,14 168,106 6,106"/></svg>',
  arrow:   '<svg class="shp-i" viewBox="0 0 220 120"><line x1="110" y1="8" x2="110" y2="86"/><polygon class="ah" points="92,82 128,82 110,114"/></svg>'
};

/* رسومات جاهزة */
const VISUALS = {
  emptyPC: () => `<div class="pc"><div class="pc-screen"><div>⚠️<br>لا يوجد أي برنامج!<span class="cur">_</span></div></div><div class="pc-neck"></div><div class="pc-base"></div><span class="floatq q1">؟</span><span class="floatq q2">؟</span><span class="floatq q3">؟</span></div>`
};
const visual = v => VISUALS[v] ? VISUALS[v]() : `<div class="emoji-xl">${v}</div>`;

const DECO_HTML = '<div class="deco"><span>{ }</span><span>&lt;/&gt;</span><span>01</span><span>if</span></div>';

function shell(s, body){
  return `<div class="sl-inner">
    <header class="sh st">
      ${s.strategy ? `<span class="chip"><b dir="ltr">//</b> ${s.strategy}</span>` : ''}
      <h2>${s.title || ''}</h2>
    </header>
    <div class="sb">${body}</div>
  </div>`;
}

/* ---------- الأصوات (Web Audio API — بدون ملفات خارجية) ---------- */
const Sound = {
  ctx: null, nb: null,
  ac(){
    try{
      if (!this.ctx){ const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this.ctx = new A(); }
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return this.ctx;
    }catch(e){ return null; }
  },
  tone(f, t0, d, type = 'sine', v = .15){
    const c = this.ac(); if (!c) return;
    const t = c.currentTime + t0, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + .05);
  },
  success(){ [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.tone(f, i * .09, .32, 'triangle', .2)); },
  ding(){ this.tone(880, 0, .18, 'triangle', .16); this.tone(1318.5, .07, .25, 'triangle', .12); },
  error(){ this.tone(311, 0, .2, 'sine', .16); this.tone(233, .15, .32, 'sine', .16); },
  click(){ this.tone(660, 0, .06, 'sine', .07); },
  step(){ this.tone(520, 0, .08, 'square', .04); },
  tick(){ this.tone(1200, 0, .05, 'square', .05); },
  bell(){ this.tone(880, 0, 1.4, 'sine', .22); this.tone(1760, 0, .9, 'sine', .07); this.tone(660, .35, 1.2, 'sine', .15); },
  /* نغمة المترو "دينغ دونغ" */
  chime(){ this.tone(659.25, 0, 1.3, 'sine', .25); this.tone(1318.5, 0, .5, 'sine', .04); this.tone(523.25, .45, 1.7, 'sine', .25); },
  /* صوت ضوضاء مفلترة: وصول القطار وفتح الأبواب */
  sweep(d, f0, f1, f2, peak, type = 'bandpass'){
    const c = this.ac(); if (!c) return;
    const s = c.createBufferSource(); s.buffer = this.noise(c); s.loop = true;
    const f = c.createBiquadFilter(); f.type = type; f.Q.value = .8;
    const g = c.createGain(), t = c.currentTime;
    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + d * .5); f.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + d * .35); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    s.connect(f); f.connect(g); g.connect(c.destination); s.start(t); s.stop(t + d + .1);
  },
  whoosh(d = 2.4){ this.sweep(d, 250, 1300, 300, .32); },
  hiss(){ this.sweep(.55, 3000, 4500, 2500, .14, 'highpass'); },
  noise(c){
    if (this.nb) return this.nb;
    const len = c.sampleRate, b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return this.nb = b;
  },
  /* تصفيق: مجموعة نقرات ضوضاء قصيرة عشوائية تحاكي جمهوراً يصفّق */
  applause(){
    const c = this.ac(); if (!c) return;
    const buf = this.noise(c), now = c.currentTime + .02, out = c.createGain(), T = 2.3;
    out.gain.value = .9; out.connect(c.destination);
    for (let i = 0; i < 90; i++){
      const k = Math.pow(Math.random(), 1.25), t = now + k * T;
      const s = c.createBufferSource(); s.buffer = buf;
      const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 800 + Math.random() * 2200; bp.Q.value = .7 + Math.random() * 1.2;
      const g = c.createGain(), peak = Math.max(.04, (.35 + Math.random() * .55) * (1 - k * .75));
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + .003); g.gain.exponentialRampToValueAtTime(.0001, t + .05 + Math.random() * .07);
      s.connect(bp); bp.connect(g); g.connect(out); s.start(t, Math.random() * .8, .16);
    }
  }
};

/* ---------- المؤثرات البصرية ---------- */
const stage = $('#stage'), box = $('#slides'), fx = $('#fx');
let SCALE = 1;
const CF_COLORS = ['#6C4CF5', '#0E9F9A', '#E2468A', '#F2A20C', '#3477F0', '#16A34A'];

function stagePoint(el){
  const r = el.getBoundingClientRect(), s = stage.getBoundingClientRect();
  return { x: (r.left + r.width / 2 - s.left) / SCALE, y: (r.top + r.height / 2 - s.top) / SCALE };
}
function burst(x, y, n = 46){
  for (let i = 0; i < n; i++){
    const p = document.createElement('i'); p.className = 'cf';
    p.style.left = x + 'px'; p.style.top = y + 'px'; p.style.background = CF_COLORS[i % CF_COLORS.length];
    if (i % 3 === 0) p.style.borderRadius = '50%';
    fx.appendChild(p);
    const a = Math.random() * Math.PI * 2, v = 160 + Math.random() * 320, dx = Math.cos(a) * v, dy = Math.sin(a) * v - 200, r = Math.random() * 720 - 360;
    p.animate([
      { transform: 'translate(-50%,-50%) rotate(0)', opacity: 1 },
      { transform: `translate(${dx}px,${dy}px) rotate(${r / 2}deg)`, opacity: 1, offset: .45 },
      { transform: `translate(${dx * 1.2}px,${dy + 520}px) rotate(${r}deg)`, opacity: 0 }
    ], { duration: 1500 + Math.random() * 700, easing: 'cubic-bezier(.2,.6,.4,1)' }).onfinish = () => p.remove();
  }
}
const confettiAt = el => { const p = stagePoint(el); burst(p.x, p.y); };
function rain(){
  for (let i = 0; i < 90; i++){
    const p = document.createElement('i'); p.className = 'cf';
    p.style.left = Math.random() * 1920 + 'px'; p.style.top = '-40px'; p.style.background = CF_COLORS[i % CF_COLORS.length];
    fx.appendChild(p);
    p.animate([{ transform: 'translate(0,0) rotate(0)' }, { transform: `translate(${Math.random() * 300 - 150}px,1180px) rotate(${Math.random() * 900}deg)` }],
      { duration: 2600 + Math.random() * 1800, delay: Math.random() * 1400, easing: 'linear' }).onfinish = () => p.remove();
  }
}

/* 👏 التصفيق: صوت + أيقونات تطير للأعلى */
function clap(){
  Sound.applause();
  const big = document.createElement('div'); big.className = 'clap-big'; big.textContent = '👏'; fx.appendChild(big);
  big.animate([
    { transform: 'translate(-50%,-50%) scale(.3)', opacity: 0 },
    { transform: 'translate(-50%,-50%) scale(1.15)', opacity: 1, offset: .25 },
    { transform: 'translate(-50%,-50%) scale(1)', opacity: 1, offset: .6 },
    { transform: 'translate(-50%,-50%) scale(1.3)', opacity: 0 }
  ], { duration: 1400, easing: 'ease-out' }).onfinish = () => big.remove();
  for (let i = 0; i < 18; i++){
    const c = document.createElement('div'); c.className = 'clap-s'; c.textContent = '👏';
    c.style.left = (160 + Math.random() * 1600) + 'px'; c.style.top = '980px'; c.style.fontSize = (44 + Math.random() * 40) + 'px';
    fx.appendChild(c);
    const dx = Math.random() * 240 - 120, dy = -(520 + Math.random() * 380), r = Math.random() * 60 - 30;
    c.animate([
      { transform: 'translate(0,0) scale(.5)', opacity: 0 },
      { transform: `translate(${dx * .2}px,-90px) scale(1)`, opacity: 1, offset: .18 },
      { transform: `translate(${dx}px,${dy}px) scale(1.15) rotate(${r}deg)`, opacity: 0 }
    ], { duration: 1900 + Math.random() * 900, delay: Math.random() * 500, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'backwards' }).onfinish = () => c.remove();
  }
  pop($('#btnClap'));
}

/* ---------- مؤقت قابل لإعادة الاستخدام ---------- */
function makeTimer(seconds){
  const C = 2 * Math.PI * 52;
  const w = document.createElement('div'); w.className = 'timer';
  w.innerHTML = `<div class="tring"><svg viewBox="0 0 120 120"><circle class="trk" cx="60" cy="60" r="52"/><circle class="tval" cx="60" cy="60" r="52" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><div class="tnum" dir="ltr"></div></div>
    <div class="tbtns"><button class="btn tgo">▶ ابدئي الوقت</button><button class="btn ghost trs" title="إعادة">↺</button></div>`;
  const val = w.querySelector('.tval'), num = w.querySelector('.tnum'), go = w.querySelector('.tgo');
  let total = seconds, left = seconds, iv = null;
  const draw = () => { num.textContent = fmt(left); val.style.strokeDashoffset = C * (1 - left / total); w.classList.toggle('warn', left <= 10 && left > 0); };
  const stop = () => { clearInterval(iv); iv = null; w.classList.remove('running'); if (left > 0) go.innerHTML = '▶ ابدئي الوقت'; };
  const start = () => {
    if (left <= 0) { left = total; draw(); }
    w.classList.remove('done'); w.classList.add('running'); go.innerHTML = '⏸ إيقاف';
    iv = setInterval(() => {
      left--; draw();
      if (left <= 5 && left > 0) Sound.tick();
      if (left <= 0){ stop(); w.classList.add('done'); num.textContent = '⏰'; Sound.bell(); go.innerHTML = '↺ مرة أخرى'; }
    }, 1000);
  };
  go.onclick = () => iv ? stop() : start();
  w.querySelector('.trs').onclick = () => { stop(); left = total; w.classList.remove('done'); go.innerHTML = '▶ ابدئي الوقت'; draw(); };
  w._pause = stop;
  w._set = s => { stop(); total = left = s; w.classList.remove('done'); go.innerHTML = '▶ ابدئي الوقت'; draw(); };
  w._start = start;
  draw();
  return w;
}

/* ربط أزرار الاختيار من متعدد */
function bindChoices(opts, correct, fb, onOk){
  let done = false;
  const mark = () => { opts[correct].classList.add('correct'); opts.forEach((o, i) => i !== correct && o.classList.add('dim')); };
  opts.forEach((b, i) => b.addEventListener('click', () => {
    if (done) return;
    if (i === correct){ done = true; mark(); feedback(fb, true); Sound.success(); confettiAt(b); onOk && onOk(); }
    else { b.classList.add('wrong'); shake(b); feedback(fb, false); Sound.error(); }
  }));
  return {
    reveal(){ done = true; mark(); onOk && onOk(); },
    reset(){ done = false; opts.forEach(o => o.classList.remove('correct', 'wrong', 'dim')); clearFb(fb); }
  };
}

/* رسم مخطط انسيابي أفقي */
function flowHTML(list){
  return `<div class="flow">${list.map((n, i) => `${i ? `<span class="fl-ar" style="--d:${i}">⟵</span>` : ''}<div class="fl fl-${n[0]}" style="--d:${i}">${n[1]}</div>`).join('')}</div>`;
